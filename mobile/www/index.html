<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThinCart</title>
<style>
  :root {
    --bg: #f6f7f4;
    --ink: #22291f;
    --muted: #6b7566;
    --green: #2f6f4f;
    --green-dark: #24583e;
    --line: #d9ded4;
    --card: #ffffff;
    --bad: #a33a2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Noto Sans JP", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; }
  .mark { text-align: center; margin-bottom: 22px; }
  .mark img { width: 76px; height: 76px; border-radius: 20px; }
  h1 { font-size: 24px; margin: 12px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; margin-top: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 13px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfa; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: transparent; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }
  button {
    width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; font-weight: 600;
    font-family: inherit; border: 0; border-radius: 10px; background: var(--green); color: #fff;
  }
  button:active { background: var(--green-dark); }
  button.ghost { background: transparent; color: var(--muted); font-weight: 500; border: 1px solid var(--line); }
  button.ghost:active { background: #eef0ea; }
  .err { color: var(--bad); font-size: 13.5px; margin: 10px 2px 0; display: none; }
  .err.on { display: block; }
  .spin {
    width: 30px; height: 30px; margin: 4px auto 0; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen { display: none; }
  .screen.on { display: block; }
  .current { font-size: 13.5px; color: var(--muted); word-break: break-all; margin: 0 0 4px; }
  .current b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="mark">
    <img src="icon-192.png" alt="">
    <h1>ThinCart</h1>
    <p class="sub">Shared shopping list</p>
  </div>

  <!-- Connecting: shown while the server is probed on a cold start -->
  <section id="screen-connecting" class="screen">
    <div class="card" style="text-align:center">
      <div class="spin"></div>
      <p class="hint" id="connecting-text">Connecting…</p>
    </div>
  </section>

  <!-- Setup: first run, or after "use a different server" -->
  <section id="screen-setup" class="screen">
    <div class="card">
      <label for="url">Server address</label>
      <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="spark-xxxx.your-tailnet.ts.net">
      <p class="hint">
        The same address you open in the browser — your Tailscale HTTPS name, or the
        tailnet IP with its port. Your phone must be on the tailnet.
      </p>
      <p class="err" id="setup-err"></p>
      <button id="connect">Connect</button>
    </div>
  </section>

  <!-- Update: the DGX is publishing a newer build than this one -->
  <section id="screen-update" class="screen">
    <div class="card">
      <p class="current"><b id="update-title">Update available</b></p>
      <p class="hint" id="update-sub"></p>
      <p class="err" id="update-err"></p>
      <button id="update-install">Install update</button>
      <button id="update-later" class="ghost">Later</button>
    </div>
  </section>

  <!-- Settings / retry: shown when the probe fails, or on returning with Back -->
  <section id="screen-settings" class="screen">
    <div class="card">
      <p class="current">Server: <b id="current-url"></b></p>
      <p class="current" id="version-line"></p>
      <p class="err" id="settings-err"></p>
      <button id="open">Open ThinCart</button>
      <button id="update-check" class="ghost">Check for an update</button>
      <button id="fresh" class="ghost">Force a fresh copy</button>
      <button id="change" class="ghost">Use a different server</button>
    </div>
  </section>
</main>

<script>
"use strict";
/* ThinCart launcher.
 *
 * The APK is a shell: the real app is the PWA the DGX serves over Tailscale, and
 * it is loaded from its own https origin so its relative /api calls, its /ws
 * WebSocket, its service worker and its localStorage op queue all keep working
 * exactly as they do in the browser. Nothing about the list lives in here.
 *
 * The address is asked for at first run rather than compiled in: this repo is
 * public, and a tailnet name is not something to publish. It is remembered in
 * localStorage afterwards, so it is asked once per install.
 */

var STORE_KEY = "thincart.server";      // localStorage — survives app restarts
var LAUNCH_KEY = "thincart.launched";   // sessionStorage — cleared on cold start
var PROBE_TIMEOUT_MS = 8000;
var HANDOFF_GRACE_MS = 6000;   // still on this page after a launch => something went wrong
var UPDATE_SKIP_KEY = "thincart.updateSkip";   // sessionStorage — "Later" holds for this run
var VERSION_TIMEOUT_MS = 5000;
/* The native bridge. Present only inside the APK — in a browser this page has
 * no Capacitor and every update path below is a no-op. */
var Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};

/* Turn what a human types into a URL to load, or null if it cannot be one.
 * Bare IPv4 means the plain-HTTP dev address (100.x.x.x:8123); a name means the
 * Tailscale HTTPS serve endpoint. An explicit scheme is always respected. */
function normalizeServerUrl(raw) {
  if (typeof raw !== "string") return null;
  var s = raw.trim();
  if (!s || /\s/.test(s)) return null;

  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) {
    var hostPart = s.split("/")[0].split(":")[0];
    s = (/^\d{1,3}(\.\d{1,3}){3}$/.test(hostPart) ? "http://" : "https://") + s;
  }

  var u;
  try { u = new URL(s); } catch (e) { return null; }
  if (u.protocol !== "http:" && u.protocol !== "https:") return null;
  if (!u.hostname) return null;
  if (u.hostname.indexOf(".") === -1 && u.hostname !== "localhost") return null;

  var out = u.origin + u.pathname.replace(/\/+$/, "");
  return out;
}

/* Reachability only. The probe is cross-origin from this page, so it runs
 * no-cors: the response is opaque and unreadable, but a dead server still
 * rejects — which is the whole question being asked. */
function probeServer(url, fetchImpl, timeoutMs) {
  var f = fetchImpl || window.fetch.bind(window);
  var ctl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, timeoutMs || PROBE_TIMEOUT_MS);
  var opts = { method: "GET", mode: "no-cors", cache: "no-store" };
  if (ctl) opts.signal = ctl.signal;
  return f(url + "/health", opts).then(
    function () { clearTimeout(timer); return true; },
    function () { clearTimeout(timer); return false; }
  );
}

/* The one real navigation this app performs. It goes through a named function
 * because jsdom locks location.assign, and the branch logic around it — cold
 * start vs Back, reachable vs not — is exactly what the tests need to drive. */
function openServer(url) {
  window.location.assign(url);
}

/* The address actually navigated to. `force` appends a value that has never
 * been requested before — the one way to bypass a cache entry with certainty
 * rather than by asking it nicely, because no partition of any cache has ever
 * seen it. That is the hammer behind "Force a fresh copy", for a phone whose
 * page is so old it predates the ↻ button inside the app itself.
 *
 * Not the default. Ordinary freshness is the service worker's job now: it
 * revalidates the shell on every navigation it sees, which costs a 304 rather
 * than the whole page, and it is registered on the server's own origin so no
 * assumption about cache partitioning is involved.
 *
 * A draft in between had this page warm the shell with a cross-origin
 * cache:"reload" fetch before handing over. It was wrong, and quietly: Chromium
 * partitions the HTTP cache by top-level site, so a fetch made while the
 * launcher is still on its own Capacitor origin refreshes a partition that the
 * subsequent top-level navigation never reads. It would have looked like it
 * worked and changed nothing. */
function launchUrl(url, force) {
  if (!force) return url;
  return url + (url.indexOf("?") === -1 ? "?" : "&") + "fresh=" + Date.now();
}

window.normalizeServerUrl = normalizeServerUrl;
window.probeServer = probeServer;
window.openServer = openServer;
window.launchUrl = launchUrl;

/* ---- in-app updates ------------------------------------------------------
 * The DGX publishes a build at GET /version (scripts/publish_apk.py). If its
 * versionCode beats the running one, the install is OFFERED before the handoff.
 * Android keeps the saved server address and any queued ops across an update
 * as long as the signing key is unchanged — which the CI gate enforces — so
 * this never costs anything. It lives here, in the bundled page, because the
 * native bridge is injected for this origin only; the tailnet page the app
 * hands over to cannot reach the installer.
 *
 * Never a gate: a /version that is slow, missing or unreachable means "no
 * update", and the app opens as usual. */
function checkUpdate(url, fetchImpl) {
  if (!Plugins.AppUpdate) return Promise.resolve(null);
  var f = fetchImpl || window.fetch.bind(window);
  var cur;
  return Plugins.AppUpdate.current().then(function (c) {
    cur = c;
    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, VERSION_TIMEOUT_MS);
    var opts = { method: "GET", mode: "cors", cache: "no-store" };
    if (ctl) opts.signal = ctl.signal;
    return f(url + "/version", opts).then(function (r) {
      clearTimeout(timer);
      return r && r.ok ? r.json() : null;
    });
  }).then(function (v) {
    if (!v || !cur || !(Number(v.versionCode) > Number(cur.versionCode))) return null;
    return { available: v, current: cur };
  }).catch(function () { return null; });
}
window.checkUpdate = checkUpdate;

function updateSkipped(code) {
  try { return sessionStorage.getItem(UPDATE_SKIP_KEY) === String(code); } catch (e) { return false; }
}

function showUpdate(u, url, onLater) {
  var v = u.available, cur = u.current;
  $("update-title").textContent = "Update available — v" + v.versionName;
  $("update-sub").textContent = "You're on v" + cur.versionName
    + (v.size ? " · " + (v.size / 1e6).toFixed(1) + " MB" : "")
    + " · your list, server address and settings are kept."
    + (v.notes ? "\n\n" + v.notes : "");
  setErr($("update-err"), cur.canInstall === false
    ? "Android will first ask you to allow installs from this app — a one-time toggle." : "");
  $("update-install").onclick = function () {
    $("update-install").disabled = true;
    setErr($("update-err"), "Downloading…");
    Plugins.AppUpdate.install({ url: url + "/apk", sha256: v.sha256 || "", size: v.size || 0 })
      .then(function (r) {
        if (r && r.status === "needs-permission") {
          setErr($("update-err"), "Allow installs from ThinCart in the screen that just opened, "
            + "then come back and tap Install again.");
        } else {
          setErr($("update-err"), "The installer is open. When it finishes, open ThinCart again.");
        }
        $("update-install").disabled = false;
      })
      .catch(function (e) {
        setErr($("update-err"), "Update failed: " + ((e && e.message) || "download error") + ". Nothing was changed.");
        $("update-install").disabled = false;
      });
  };
  $("update-later").onclick = function () {
    try { sessionStorage.setItem(UPDATE_SKIP_KEY, String(v.versionCode)); } catch (e) { /* this run only */ }
    onLater();
  };
  show("update");
}

/* The settings screen says which build this is and whether a newer one waits. */
function renderVersion(url) {
  var line = $("version-line");
  if (!Plugins.AppUpdate) { line.textContent = ""; return; }
  Plugins.AppUpdate.current().then(function (c) {
    line.textContent = "App v" + c.versionName;
    if (!url) return;
    return checkUpdate(url).then(function (u) {
      line.textContent = u ? "App v" + c.versionName + " → v" + u.available.versionName + " available"
                           : "App v" + c.versionName + " · up to date";
    });
  }).catch(function () { line.textContent = ""; });
}

/* ---- screens ---------------------------------------------------------- */

var $ = function (id) { return document.getElementById(id); };

function show(name) {
  ["connecting", "setup", "settings", "update"].forEach(function (s) {
    $("screen-" + s).classList.toggle("on", s === name);
  });
}

function setErr(el, msg) {
  el.textContent = msg || "";
  el.classList.toggle("on", !!msg);
}

function savedServer() {
  try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
}

function saveServer(url) {
  try { localStorage.setItem(STORE_KEY, url); } catch (e) { /* private mode: this run only */ }
}

/* Mark that we handed off, so the hardware Back button lands on the settings
 * screen instead of bouncing straight back out to the server.
 *
 * A handoff can also be REFUSED, and silently: Capacitor checks the target
 * against server.allowNavigation and simply declines a host that does not
 * match, leaving this page on screen with its spinner running forever. That
 * shipped once already — the masks are label-counted, so "*.ts.net" did not
 * match a four-label MagicDNS name. The address was fine and the server was
 * up; only the app said no, and it said it to nobody. So: if we are still
 * here a moment later, the navigation did not happen, and that is worth
 * saying out loud rather than spinning. */
var refusalTimer = null;

function cancelRefusal() {
  if (refusalTimer !== null) {
    window.clearTimeout(refusalTimer);
    refusalTimer = null;
  }
}

/* A navigation that DID happen leaves this document either torn down or parked
 * in the WebView's back-forward cache, where timers are paused rather than
 * dropped — so a Back press within the grace period would resume the refusal
 * timer and blame the app for something it did correctly. pagehide fires in
 * both cases and is the signal that the handoff worked. */
window.addEventListener("pagehide", cancelRefusal);

function launch(url, force) {
  try { sessionStorage.setItem(LAUNCH_KEY, "1"); } catch (e) { /* non-fatal */ }
  cancelRefusal();
  /* Deliberately does NOT name a cause. From in here the two ways this can go
   * wrong are indistinguishable: Capacitor refusing the address (it fires an
   * ACTION_VIEW intent, so the page opens in the system browser instead), or a
   * navigation that was accepted and is merely slow to commit. Backgrounding
   * looked like it separated them until you notice that locking the phone
   * backgrounds the app too. So this says what is observably true and offers
   * the two actions that help either way. */
  refusalTimer = window.setTimeout(function () {
    refusalTimer = null;
    showSettings("Couldn't finish opening " + url.replace(/^https?:\/\//, "") +
      ". The server answered, so the address is reachable. Try again — and if " +
      "it keeps landing here, or opens in your browser instead, check the " +
      "address matches the one you use in the browser.");
  }, HANDOFF_GRACE_MS);
  window.openServer(window.launchUrl(url, force));
}

function showSettings(msg) {
  $("current-url").textContent = savedServer() || "—";
  setErr($("settings-err"), msg);
  renderVersion(savedServer());
  show("settings");
}

function showSetup(prefill, msg) {
  $("url").value = prefill || "";
  setErr($("setup-err"), msg);
  show("setup");
}

function tryLaunch(url, force) {
  show("connecting");
  $("connecting-text").textContent = "Connecting to " + url.replace(/^https?:\/\//, "") + "…";
  return probeServer(url).then(function (ok) {
    if (!ok) {
      showSettings("Can't reach that server. Check that Tailscale is connected on this phone.");
      return;
    }
    // A newer build on the DGX is offered first; "Later" and anything that
    // goes wrong with the check fall through to the app as usual.
    return checkUpdate(url).then(function (u) {
      if (u && !updateSkipped(u.available.versionCode)) {
        showUpdate(u, url, function () { launch(url, force); });
      } else {
        launch(url, force);
      }
    });
  });
}

function start() {
  var saved = savedServer();
  var returned = false;
  try { returned = sessionStorage.getItem(LAUNCH_KEY) === "1"; } catch (e) { /* ignore */ }

  if (!saved) { showSetup("", ""); return; }
  if (returned) { showSettings(""); return; }
  tryLaunch(saved);
}

$("connect").addEventListener("click", function () {
  var url = normalizeServerUrl($("url").value);
  if (!url) {
    setErr($("setup-err"), "That doesn't look like an address. Try spark-xxxx.your-tailnet.ts.net");
    return;
  }
  saveServer(url);
  tryLaunch(url);
});

$("url").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); $("connect").click(); }
});

$("open").addEventListener("click", function () {
  var saved = savedServer();
  if (saved) tryLaunch(saved); else showSetup("", "");
});

/* Reachable with Back, and the only control that still works when the page the
 * server hands over is itself too old to contain its own ↻ button. Before this
 * existed the only way out of that was Android's app-storage screen. */
$("fresh").addEventListener("click", function () {
  var saved = savedServer();
  if (saved) tryLaunch(saved, true); else showSetup("", "");
});

$("change").addEventListener("click", function () {
  showSetup(savedServer() || "", "");
});

$("update-check").addEventListener("click", function () {
  var saved = savedServer();
  if (!saved) { showSetup("", ""); return; }
  if (!Plugins.AppUpdate) { setErr($("settings-err"), "Updates are Android-only — this is running in a browser."); return; }
  setErr($("settings-err"), "Checking…");
  checkUpdate(saved).then(function (u) {
    if (u) { showUpdate(u, saved, function () { showSettings(""); }); return; }
    setErr($("settings-err"), "");
    renderVersion(saved);
  });
});

start();
</script>
</body>
</html>
