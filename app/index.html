<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2f6f4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ThinCart</title>
<style>
  :root {
    --green:#2f6f4f; --green-dark:#245840; --bg:#f6f7f4; --card:#fff;
    --text:#1d2b23; --muted:#7a8a80; --amber:#c77b1e; --red:#b3402e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header {
    background:var(--green); color:#fff; padding:12px 10px 12px 14px;
    display:flex; align-items:center; gap:6px; position:sticky; top:0; z-index:10;
  }
  /* the header must NEVER exceed the viewport: overflow here makes the whole
   * page scroll sideways and clips every row's right edge ("note cut off").
   * Title and pill are the shrinkable parts; buttons keep their size. */
  header h1 { font-size:1.15rem; margin:0; flex:1; font-weight:700;
              min-width:0; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  #pill {
    font-size:.72rem; font-weight:600; padding:4px 8px; border-radius:999px;
    background:#ffffff2b; color:#fff; white-space:nowrap;
    min-width:0; overflow:hidden; text-overflow:ellipsis;
  }
  #pill.synced::before  { content:"● "; color:#8ee6a1; }
  #pill.syncing::before { content:"● "; color:#ffd479; }
  #pill.offline::before { content:"● "; color:#ff9d8a; }
  form#add {
    display:flex; gap:8px; padding:12px 16px; background:var(--card);
    border-bottom:1px solid #e3e7e0; position:sticky; top:48px; z-index:9;
  }
  #cands {
    position:absolute; top:100%; left:12px; right:12px; background:var(--card);
    border:1px solid #dde4dc; border-top:none; border-radius:0 0 14px 14px;
    box-shadow:0 8px 18px #00000022; display:none; max-height:46vh; overflow-y:auto;
  }
  .cand {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-bottom:1px solid #f0f3ee; cursor:pointer; font-size:.98rem;
  }
  .cand:last-child { border-bottom:none; }
  .cand:active { background:#eef5f0; }
  /* already on the list: shown rather than hidden, so retyping an item is a way
     back into it (tap = edit sheet), not a dead-end empty dropdown */
  .cand.on { background:#f4faf6; }
  .cand.on .alt { color:var(--green-dark); font-weight:600; }
  .cand .cat-tag { margin-left:auto; color:var(--muted); font-size:.74rem; white-space:nowrap; }
  #name {
    flex:1; font-size:1rem; padding:10px 12px; border:1.5px solid #d4dcd4;
    border-radius:10px; outline:none; min-width:0;
  }
  #name:focus { border-color:var(--green); }
  #qty { width:74px; font-size:.9rem; padding:10px 8px; border:1.5px solid #d4dcd4; border-radius:10px; outline:none; }
  button.add-btn {
    background:var(--green); color:#fff; border:none; border-radius:10px;
    font-size:1.3rem; width:46px; flex-shrink:0; cursor:pointer;
  }
  button.add-btn:active { background:var(--green-dark); }
  main { flex:1; overflow-y:auto; padding:8px 12px 90px; }
  .cat { font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
         color:var(--muted); margin:14px 6px 6px; }
  .cat .approx { font-weight:600; letter-spacing:0; text-transform:none; opacity:.75; }
  /* Category | Aisle — only while standing in a store that can answer. */
  #viewtoggle { display:none; gap:0; margin:2px 0 10px; border:1.5px solid #d4dcd4;
    border-radius:999px; overflow:hidden; background:var(--card); }
  #viewtoggle.on { display:flex; }
  #viewtoggle button { flex:1; border:none; background:none; padding:8px 10px;
    font:inherit; font-size:.82rem; font-weight:600; color:var(--muted); cursor:pointer; }
  #viewtoggle button.sel { background:var(--green); color:#fff; }
  #aislenote { display:none; font-size:.78rem; color:var(--muted); margin:0 4px 10px; }
  #aislenote.on { display:block; }
  ul#list { list-style:none; margin:0; padding:0; }
  li.item {
    position:relative; overflow:hidden; border-radius:12px; margin-bottom:8px;
    box-shadow:0 1px 2px #0000000a; user-select:none; -webkit-user-select:none;
    cursor:pointer; touch-action:pan-y;   /* vertical scroll native, horizontal = swipe */
  }
  li.item .under {
    position:absolute; inset:0; display:flex; align-items:center;
    font-weight:700; font-size:.95rem; opacity:0; padding:0 18px;
  }
  li.item .under.right { background:#dff3e4; color:var(--green-dark); justify-content:flex-start; }
  li.item .under.left  { background:#fdf3e3; color:var(--amber); justify-content:flex-end; }
  li.item .row {
    position:relative; background:var(--card); border-radius:12px;
    display:flex; align-items:center; gap:12px; padding:13px 14px;
  }
  li.item.pending .row { opacity:.55; }
  li.item .box {
    width:22px; height:22px; border:2px solid #b9c6bc; border-radius:7px; flex-shrink:0;
  }
  li.item .nm { flex:1; font-size:1.02rem; overflow-wrap:anywhere; }
  li.item .qty { color:var(--muted); font-size:.85rem; }
  li.item .who { color:var(--muted); font-size:.72rem; }
  li.item .sub { color:var(--muted); font-size:.74rem; margin-top:2px;
                 overflow-wrap:anywhere; }
  .stchip { display:inline-block; background:#eef5f0; color:var(--green-dark);
            border-radius:6px; padding:1px 6px; font-size:.72rem; }
  .stchip.hist { background:#f2f0e9; color:#8a7a4e; }
  #empty { text-align:center; color:var(--muted); margin-top:48px; font-size:.95rem; }
  #toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#243b2f; color:#fff; padding:12px 16px; border-radius:12px;
    display:none; align-items:center; gap:14px; font-size:.92rem; z-index:20;
    box-shadow:0 4px 14px #00000040; max-width:92vw;
  }
  #toast button {
    background:none; border:none; color:#8ee6a1; font-weight:700; font-size:.92rem;
    cursor:pointer; padding:4px;
  }
  #sheet {
    position:fixed; inset:0; background:#0007; display:none; z-index:30;
    align-items:flex-end;
  }
  #sheet .card {
    background:var(--card); width:100%; border-radius:18px 18px 0 0; padding:20px 18px
      calc(20px + env(safe-area-inset-bottom));
    /* the card is taller than a phone (name/qty/note/budget/stores/9 categories/
     * 4 buttons). #sheet is position:fixed with align-items:flex-end, so any
     * overflow goes off the TOP of the screen where nothing can scroll to it —
     * that put Quantity, the 2nd field, out of reach entirely. Cap and scroll. */
    max-height:92vh; max-height:92dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  #sheet h2 { margin:0 0 4px; font-size:1.05rem; }
  #sheet p { margin:0 0 16px; color:var(--muted); font-size:.88rem; }
  #sheet button {
    width:100%; padding:14px; border-radius:12px; border:none; font-size:1rem;
    font-weight:600; margin-bottom:10px; cursor:pointer;
  }
  #sheet .skip { background:#fdf3e3; color:var(--amber); }
  #sheet .danger { background:#fbe9e5; color:var(--red); }
  #sheet .cancel { background:#eef1ec; color:var(--text); }
  #sheet .save { background:var(--green); color:#fff; }
  #sheet .sheet-field { display:flex; align-items:center; gap:10px; margin:0 0 14px; }
  #sheet .sheet-field span { font-size:.9rem; color:var(--muted); min-width:62px; }
  #sheet #sheet-name, #sheet #sheet-qty { flex:1; padding:12px; border:1.5px solid #d4dcd4;
    border-radius:10px; font-size:1rem; outline:none; }
  #sheet .sheet-field-label { font-size:.72rem; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin:0 2px 8px; }
  #sheet #sheet-cats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    margin-bottom:16px; }
  #sheet .catopt { margin:0; padding:10px 4px; border:1.5px solid #d4dcd4;
    border-radius:10px; background:var(--card); font-size:.8rem; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px; }
  #sheet .catopt.sel { border-color:var(--green); background:#e9f5ec; color:var(--green-dark); }
  #sheet .catopt .em { font-size:1.15rem; }
  #sheet #sheet-note-input, #sheet #sheet-budget { flex:1; padding:12px;
    border:1.5px solid #d4dcd4; border-radius:10px; font-size:1rem; outline:none;
    min-width:0; }
  /* a NOTE must be fully visible while editing — a single-line input clips it */
  #sheet #sheet-note-input { font-family:inherit; resize:none; line-height:1.35; }
  #sheet #sheet-stores { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  #sheet .stopt { width:auto; padding:9px 14px; border:1.5px solid #d4dcd4;
    border-radius:999px; background:var(--card); font-size:.86rem; font-weight:600;
    margin:0; }
  #sheet .stopt.sel { border-color:var(--green); background:#e9f5ec;
    color:var(--green-dark); }
  #sheet #sheet-newstore { padding:9px 12px; border:1.5px dashed #d4dcd4;
    border-radius:999px; font-size:.86rem; outline:none; width:9em; }
  #stores-panel { position:fixed; inset:0; background:var(--bg); z-index:35;
    display:none; flex-direction:column; }
  #stores-panel header { position:static; }
  #stores-panel .body { flex:1; overflow-y:auto; padding:14px 16px 40px; }
  #stores-panel h3 { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:18px 2px 8px; }
  #stores-panel .topbtn { background:#ffffff2b; border:none; color:#fff;
    font-size:.8rem; font-weight:700; padding:5px 12px; border-radius:999px;
    cursor:pointer; }
  #at-chips .chip { border-style:solid; }
  #at-chips .chip.sel { background:var(--green); color:#fff; border-color:var(--green); }
  .plangroup { background:var(--card); border-radius:14px; padding:12px 15px;
    margin-bottom:10px; box-shadow:0 1px 2px #0000000a; }
  .plangroup .ghead { display:flex; align-items:baseline; gap:8px; }
  .plangroup .ghead b { font-size:1rem; flex:1; }
  .plangroup .ghead .gsum { color:var(--muted); font-size:.82rem; white-space:nowrap; }
  .plangroup .pitem { display:flex; gap:8px; font-size:.92rem; padding:5px 0;
    border-bottom:1px solid #f0f3ee; }
  .plangroup .pitem:last-child { border-bottom:none; }
  .plangroup .pitem .pnm { flex:1; overflow-wrap:anywhere; }
  .plangroup .pitem .pmeta { color:var(--muted); font-size:.8rem; white-space:nowrap; }
  .storerow { background:var(--card); border-radius:12px; padding:12px 14px;
    margin-bottom:8px; box-shadow:0 1px 2px #0000000a; }
  .storerow .srhead { display:flex; align-items:center; gap:8px; }
  .storerow .srhead b { flex:1; font-size:.98rem; overflow-wrap:anywhere; }
  .storerow .del { border:1.5px solid #e6c6bd; background:#fbe9e5; color:var(--red);
    border-radius:999px; padding:6px 12px; font-size:.78rem; font-weight:700;
    cursor:pointer; }
  .storerow textarea { width:100%; margin-top:8px; padding:9px 10px; resize:vertical;
    border:1.5px solid #d4dcd4; border-radius:10px; font-size:.9rem; outline:none;
    font-family:inherit; min-height:40px; }
  .storerow .savenotes { margin-top:6px; background:var(--green); color:#fff;
    border:none; border-radius:9px; padding:8px 14px; font-size:.82rem;
    font-weight:600; cursor:pointer; display:none; }
  #newstore-row { display:flex; gap:8px; }
  #newstore-row input { flex:1; padding:11px 12px; border:1.5px solid #d4dcd4;
    border-radius:10px; font-size:.95rem; outline:none; min-width:0; }
  #newstore-row button { background:var(--green); color:#fff; border:none;
    border-radius:10px; padding:0 16px; font-size:1.1rem; cursor:pointer; }
  #storesearch-row { display:flex; gap:8px; margin-top:8px; }
  #storesearch-row input { flex:1; padding:11px 12px; border:1.5px solid #d4dcd4;
    border-radius:10px; font-size:.95rem; outline:none; min-width:0; }
  #storesearch-row button { background:#eef2ec; color:var(--ink); border:1.5px solid #d4dcd4;
    border-radius:10px; padding:0 16px; font-size:1.05rem; cursor:pointer; }
  #storesearch-results:not(:empty) { margin-top:10px; border:1.5px solid #d4dcd4;
    border-radius:12px; overflow:hidden; background:var(--card); }
  .osmhit { padding:11px 13px; cursor:pointer; border-bottom:1px solid #eceee9; }
  .osmhit:last-child { border-bottom:none; }
  .osmhit:active { background:#eef2ec; }
  .osmhit b { display:block; font-size:.95rem; }
  .osmhit span { display:block; color:var(--muted); font-size:.78rem; margin-top:2px;
    overflow-wrap:anywhere; }
  .osmnote { padding:11px 13px; color:var(--muted); font-size:.83rem; }
  .storerow .addr { color:var(--muted); font-size:.78rem; margin-top:3px;
    overflow-wrap:anywhere; }
  .linkbtn { border:1.5px solid #d4dcd4; background:#eef2ec; color:var(--ink);
    border-radius:999px; padding:5px 11px; font-size:.76rem; font-weight:700;
    cursor:pointer; font-family:inherit; }
  .linkbtn:disabled { opacity:.6; }
  #sheet-compare { margin:2px 0 6px; }
  #sheet-prices:not(:empty) { margin-bottom:12px; border:1.5px solid #d4dcd4;
    border-radius:12px; overflow:hidden; }
  .prow { display:flex; align-items:baseline; gap:8px; padding:9px 11px;
    border-bottom:1px solid #eceee9; cursor:pointer; font-size:.86rem; }
  .prow:last-child { border-bottom:none; }
  .prow:active { background:#eef2ec; }
  .prow.sel { background:#eaf3ec; }
  .prow.oos { opacity:.55; cursor:default; }
  .prow .psrc { color:var(--muted); text-decoration:none; padding:0 2px; font-size:.9rem; }
  .prow .pn { flex:1; overflow-wrap:anywhere; }
  .prow .pp { font-weight:700; white-space:nowrap; }
  .prow .pu { color:var(--muted); font-size:.76rem; white-space:nowrap; }
  .pnote { padding:9px 11px; color:var(--muted); font-size:.79rem; }
  .stores-note { color:var(--muted); font-size:.8rem; margin:20px 2px; }
  #buildline { margin-top:-8px; font-variant-numeric:tabular-nums; }
  #buildline.stale { color:var(--red); font-weight:600; }
  #reload-btn { display:block; width:100%; margin:6px 0 4px; padding:11px;
    background:#fff; color:var(--ink); border:1.5px solid #d4dcd4; border-radius:10px;
    font-size:.92rem; font-weight:600; font-family:inherit; cursor:pointer; }
  #reload-btn:active { background:#eef2ec; }
  #reload-btn[disabled] { opacity:.55; }
  #buildline.stale ~ #reload-btn { border-color:var(--red); color:var(--red); }
  #reload-err { color:var(--red); font-size:.8rem; margin:2px 2px 20px; display:none; }
  #reload-err.on { display:block; }
  #namedlg {
    position:fixed; inset:0; background:var(--bg); z-index:40; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px;
  }
  #namedlg input { font-size:1.1rem; padding:12px 14px; border:1.5px solid #d4dcd4;
    border-radius:10px; width:min(320px,90vw); text-align:center; }
  #namedlg button { background:var(--green); color:#fff; border:none; border-radius:10px;
    padding:12px 28px; font-size:1rem; font-weight:600; cursor:pointer; }
  #tray { padding:10px 12px 0; display:none; }
  #tray .tray-label { font-size:.72rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:0 6px 6px; }
  .chip {
    display:inline-flex; align-items:center; gap:7px; background:#e9f5ec;
    border:1.5px dashed #9ec7ab; color:var(--green-dark); border-radius:999px;
    padding:7px 6px 7px 13px; margin:0 6px 6px 0; font-size:.92rem; cursor:pointer;
    user-select:none; -webkit-user-select:none;
  }
  .chip .lbl { font-size:.7rem; color:var(--muted); }
  .chip .snz {
    border:none; background:#d3e8d9; color:var(--green-dark); border-radius:999px;
    width:22px; height:22px; font-size:.8rem; line-height:1; cursor:pointer; padding:0;
  }
  #plants, #lang, #hist, #stores-btn, #trips, #set-btn {
    background:#ffffff2b; border:none; color:#fff; font-size:.8rem; font-weight:700;
    padding:5px 8px; border-radius:999px; cursor:pointer; white-space:nowrap;
    flex-shrink:0;
  }
  /* unreviewed trips are the only reason to open the panel — say how many */
  #trips.pending { background:var(--amber); color:#fff; }
  .cand .alt { color:var(--muted); font-size:.8rem; }
  #ideas {
    position:fixed; inset:0; background:var(--bg); z-index:35; display:none;
    flex-direction:column;
  }
  #ideas header { position:static; }
  #ideas .body { flex:1; overflow-y:auto; padding:14px 16px 40px; }
  #ideas h3 { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:18px 2px 8px; }
  .pchip { display:inline-block; background:#e9f5ec; color:var(--green-dark);
    border-radius:999px; padding:5px 12px; margin:0 5px 6px 0; font-size:.85rem; }
  .pchip.new { background:#fff; border:1.5px dashed #9ec7ab; cursor:pointer; }
  .recipe { background:var(--card); border-radius:14px; padding:14px 15px;
    margin-bottom:10px; box-shadow:0 1px 2px #0000000a; }
  .recipe b { font-size:1rem; }
  .recipe .row { font-size:.85rem; margin-top:6px; color:var(--muted);
    overflow-wrap:anywhere; }
  .recipe .np { color:var(--green-dark); font-weight:600; }
  .recipe button { margin-top:10px; background:var(--green); color:#fff; border:none;
    border-radius:9px; padding:9px 14px; font-size:.86rem; font-weight:600; cursor:pointer; }
  #ideas .status { text-align:center; color:var(--muted); margin:40px 12px; font-size:.92rem; }
  #ideas .topbtn { background:#ffffff2b; border:none; color:#fff; font-size:.8rem;
    font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
  #tray .tray-label { cursor:pointer; }
  #tray .tray-label::after { content:' ▸'; color:var(--green); }
  .chip.more { background:#eef1ec; border-style:solid; border-color:#d4dcd4; color:var(--muted); }
  #cyc { position:fixed; inset:0; background:var(--bg); z-index:35; display:none;
         flex-direction:column; }
  #cyc header { position:static; }
  #cyc .body { flex:1; overflow-y:auto; padding:14px 16px 40px; }
  #cyc h3, #trip-panel h3 { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
            color:var(--muted); margin:18px 2px 8px; }
  #cyc .topbtn { background:#ffffff2b; border:none; color:#fff; font-size:.8rem;
    font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
  .cycrow { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:8px;
            display:flex; align-items:center; gap:10px; box-shadow:0 1px 2px #0000000a; }
  .cycrow.due { border-left:4px solid var(--green); cursor:pointer; }
  .cycrow .nm { flex:1; font-size:.98rem; overflow-wrap:anywhere; }
  .cycrow .meta { text-align:right; font-size:.74rem; color:var(--muted); line-height:1.5;
                  white-space:nowrap; }
  .cycrow .meta b { color:var(--green-dark); font-size:.8rem; }
  .cycrow .bar { height:4px; border-radius:2px; background:#e6ece6; margin-top:5px;
                 overflow:hidden; width:84px; }
  .cycrow .bar i { display:block; height:100%; background:var(--green); }
  .cycrow.over .bar i { background:var(--amber); }
  .cyc-note { color:var(--muted); font-size:.8rem; margin:20px 2px; }
  /* "might need this week" is a softer call to action than "buy now" — a left
     rule rather than the full due highlight, so the two never look alike */
  .cycrow.tier-potential { border-left:3px solid var(--amber); }
  /* nothing due: real history, but no call to action this week */
  .cycrow.tier-none { opacity:.62; }
  .cycrow.tier-none .bar { visibility:hidden; }
  .chip.maybe { border-style:dashed; }
  #set-panel { position:fixed; inset:0; background:var(--bg); z-index:35; display:none;
               flex-direction:column; }
  #set-panel header { position:static; }
  #set-panel .body { flex:1; overflow-y:auto; padding:14px 16px 40px; }
  #set-panel h3 { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:18px 2px 8px; }
  #set-panel .topbtn { background:#ffffff2b; border:none; color:#fff; font-size:.8rem;
    font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
  .set-note { color:var(--muted); font-size:.8rem; margin:12px 2px 20px; }
  #hist-panel { position:fixed; inset:0; background:var(--bg); z-index:35; display:none;
                flex-direction:column; }
  #hist-panel header { position:static; }
  #hist-panel .body { flex:1; overflow-y:auto; padding:14px 16px 40px; }
  #hist-panel .topbtn { background:#ffffff2b; border:none; color:#fff; font-size:.8rem;
    font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
  .histrow { background:var(--card); border-radius:12px; padding:11px 8px 11px 14px;

 * base   — last full state from the server (source of truth)
 * queue  — pending ops not yet ACKed (persisted in localStorage; survives

const $ = id => document.getElementById(id);
/* crypto.randomUUID exists ONLY in secure contexts — on plain http:// it is
 * undefined and every add silently threw. getRandomValues works everywhere. */
const uuid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
};
/* Stamped by the server as this page is served: the content hash of the file it
 * came from. Derived, never hand-written — a constant someone must remember to

const LS = { name:'pc_name', queue:'pc_queue', base:'pc_base' };

/* ============ view = base + pending ops ============ */
function view() {
  let items = base.items.map(i => ({...i}));
  for (const op of queue) {
    if (op.type === 'add') {
      if (!items.some(i => canon(i.name) === canon(op.name)))
        items.push({ id:op.item_id, name:op.name, qty_note:op.qty_note||'',
                     added_by:op.actor, category:op.cat||null, pending:true });
    } else if (op.type === 'checkoff' || op.type === 'remove' || op.type === 'skip') {
      items = items.filter(i => i.id !== op.item_id);
    } else if (op.type === 'edit') {
      const it = items.find(i => i.id === op.item_id);
      if (it) {
        if (op.name !== undefined) { it.name = op.name; it.name_en = null; }
        if (op.qty_note !== undefined) it.qty_note = op.qty_note;
        if (op.category !== undefined) it.category = op.category;
        if (op.note !== undefined) it.note = op.note;
        if (op.budget !== undefined) {          // mirror server: invalid → ignored
          const v = budgetNum(op.budget);
          if (v !== undefined) it.budget = v;
        }
        if (op.store !== undefined) {           // '' clears, like the server
          it.store = op.store || null;
          it.store_source = op.store ? 'preferred' : null;
        }
      }
    }
  }
  return items;
}

const TRAY_MAX = 5;
function renderTray() {
  const chips = $('chips');
  chips.innerHTML = '';
  const listed = new Set(view().map(i => canon(i.name)));
  const pendingSnoozes = new Set(
    queue.filter(o => o.type === 'snooze').map(o => o.catalog_id));
  const all = (base.suggestions || []).filter(s =>
    !listed.has(canon(s.name)) && !pendingSnoozes.has(s.catalog_id));
  const sugg = all.slice(0, TRAY_MAX);
  $('tray').style.display = all.length ? 'block' : 'none';
  for (const s of sugg) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `<span class="nm"></span><span class="lbl"></span>
                      <button class="snz" aria-label="Snooze">✕</button>`;
    chip.querySelector('.nm').textContent = '＋ ' + disp(s);
    // a potential suggestion rests on thin or erratic history — say so, don't
    // dress it up as a settled rhythm
    chip.querySelector('.lbl').textContent =
      cycWeeks(s) + (s.tier === 'potential' ? ' ?' : '');
    chip.classList.toggle('maybe', s.tier === 'potential');
    chip.onclick = () => enqueue({ type:'add', name:s.name, qty_note:'', item_id:uuid() });
    chip.querySelector('.snz').onclick = e => {
      e.stopPropagation();
      enqueue({ type:'snooze', catalog_id:s.catalog_id });
    };
    chips.appendChild(chip);
  }
  if (all.length > TRAY_MAX) {
    const more = document.createElement('span');
    more.className = 'chip more';
    more.textContent = T().tray_more(all.length - TRAY_MAX);
    more.onclick = openCycles;
    chips.appendChild(more);
  }
}

/* ============ full suggestion / cycles panel ============ */
/* Cycles are grouped in whole weeks — weekly, bi-weekly, every 3 weeks, with no
   upper bin. The measured days ride alongside, because rounding 17 days to
   "bi-weekly" must not be mistaken for the number the app is actually using. */
const cycWeeks = c =>
  c.weeks === null || c.weeks === undefined ? T().cyc_subweekly
  : c.weeks === 1 ? T().cyc_weekly
  : c.weeks === 2 ? T().cyc_biweekly
  : T().cyc_nweeks(c.weeks);

const cycText = c =>
  c.median_days === null || c.median_days === undefined
    ? T().cyc_once
    : `${cycWeeks(c)} · ${Math.round(c.median_days)}d`;

/* "due in 3 days" / "4 days over" — the number a person can act on, where the
   raw 0.71 score never was. */
const dueText = c => {
  if (c.due_in_days === null || c.due_in_days === undefined) return '';
  const d = Math.round(c.due_in_days);
  return d > 0 ? T().due_in(d) : T().due_over(Math.abs(d));
};

/* The evidence behind the tier stays available on hover rather than as a badge
   on every row: it explains a suggestion when questioned, without competing
   with the suggestion itself. */
const evidence = c =>
  T().tier_evidence(c.events, c.spread === null ? '—' : c.spread)
  + (c.trusted ? '' : ' · ' + T().tier_shaky);

$('tray-label').onclick = openCycles;
$('cyc-close').onclick = () => $('cyc').style.display = 'none';

async function openCycles() {
  $('cyc').style.display = 'flex';
  $('cyc-due').innerHTML = $('cyc-all').innerHTML = '<div class="cyc-note">…</div>';
  try {
    const res = await fetch('/api/cycles');
    const body = await res.json();
    const rows = body.cycles;
    const mk = c => {
      const div = document.createElement('div');
      const tier = c.tier || 'none';
      div.className = 'cycrow tier-' + tier
        + (c.tier ? ' due' : '') + (c.score > 1.15 ? ' over' : '');
      div.innerHTML = `<span class="nm"></span>
        <span class="meta"><b></b><br><span class="ago"></span>
        <span class="bar"><i></i></span></span>`;
      div.querySelector('.nm').textContent = (c.tier ? '＋ ' : '') + disp(c)
        + (c.on_list ? ' ✓' : '');
      // the week is the grouping; the measured days are what actually decides
      // due-ness, so show both rather than let the rounding look like the truth
      div.querySelector('b').textContent = cycText(c);
      div.title = evidence(c);
      div.querySelector('.ago').textContent = dueText(c);
      div.querySelector('.bar i').style.width =
        c.score === null ? '0%' : Math.min(c.score * 100, 100) + '%';
      if (c.tier) div.onclick = () => {
        enqueue({ type:'add', name:c.name, qty_note:'', item_id: uuid() });
        div.remove();
        showToast(T().added(disp(c)), () => {});
      };
      return div;
    };
    /* Four sections, in the order a shopping trip needs them: buy these, you
       might need these before the week is out, everything else being tracked,
       and the bought-once tail. */
    const fill = (box, list, empty) => {
      box.innerHTML = list.length ? '' : `<div class="cyc-note">${empty}</div>`;
      list.forEach(c => box.appendChild(mk(c)));
    };
    fill($('cyc-due'), rows.filter(c => c.tier === 'high'), T().cyc_none_due);
    const soon = rows.filter(c => c.tier === 'potential');
    $('cyc-soon-h').textContent = T().cyc_soon_h(body.week_horizon);
    $('cyc-soon-h').hidden = !soon.length;
    fill($('cyc-soon'), soon, '');
    $('cyc-soon').hidden = !soon.length;
    fill($('cyc-all'), rows.filter(c => !c.tier && c.median_days !== null), T().cyc_none);
    const once = rows.filter(c => c.median_days === null);
    $('cyc-once-h').textContent = T().cyc_once_h(once.length);
    $('cyc-once-h').hidden = !once.length;
    fill($('cyc-once'), once, '');
  } catch (e) {
    $('cyc-due').innerHTML = `<div class="cyc-note">offline</div>`;
  }
}

async function openHistory() {
  $('hist-panel').style.display = 'flex';
  const box = $('hist-list');
  box.innerHTML = `<div class="hist-note">…</div>`;
