  try {
    hist = (await (await fetch('/api/history')).json()).history;
  } catch (e) {
    box.innerHTML = `<div class="hist-note">offline</div>`;
    return;
  }
  box.innerHTML = '';
  if (!hist.length) { box.innerHTML = `<div class="hist-note">${T().hist_empty}</div>`; return; }
  for (const h of hist) {
    const days = Math.max(0, Math.floor((Date.now() - Date.parse(h.bought_at)) / 86400000));
    const when = days === 0 ? T().hist_today : T().last_bought(days);
    const who = h.bought_by ? ' · ' + T().hist_by(h.bought_by) : '';
    const div = document.createElement('div');
    div.className = 'histrow';
    div.innerHTML = `<span class="nm"></span>
      <span class="meta"></span><button class="undo-btn"></button>`;
    div.querySelector('.nm').textContent = disp(h);
    div.querySelector('.meta').textContent = when + who;
    const btn = div.querySelector('.undo-btn');
    btn.textContent = T().hist_undo;
    btn.onclick = () => {
      // idempotent server-side: a double-tap / other-phone repeat is a no-op ACK
      enqueue({ type:'undo_purchase', event_id: h.event_id });
      div.classList.add('undone');
      btn.disabled = true;
      showToast(T().hist_restored(disp(h)), () => {});
    };
    box.appendChild(div);
  }
}

/* ============ travel panel: review the days the calendar calls "away" ============
   Detection only ever proposes. Every day here is one tap from being corrected,
   and the server never overwrites a day that has been ruled on — which is what
   makes it safe for the heuristics to guess in the first place. */
$('trips').onclick = openTrips;
$('trip-close').onclick = () => $('trip-panel').style.display = 'none';

$('trip-sync').onclick = async () => {
  const btn = $('trip-sync');
  btn.disabled = true; btn.textContent = '…';
  try {
    const res = await fetch('/api/calendar/sync', { method:'POST' });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    await openTrips();
  } catch (e) {
    setTripStatus(T().trip_error(e.message), true);
  } finally {
    btn.disabled = false; btn.textContent = T().trip_sync;
  }
};

$('trip-day-go').onclick = async () => {
  const day = $('trip-day').value;
  if (!day) return;
  await setAway([day], 'confirmed');
  $('trip-day').value = '';
  openTrips();
};

function setTripStatus(text, bad) {
  const el = $('trip-status');
  el.textContent = text;
  el.classList.toggle('bad', !!bad);
}

/* A trip is a run of days; the user rules on the whole run at once, but the
   server stores days, so partial trips stay expressible via the date field. */
async function setAway(days, status) {
  for (const day of days) {
    await fetch('/api/away', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ day, status }),
    });
  }
}

function fmtSpan(trip) {
  const opts = { month:'short', day:'numeric' };
  const a = new Date(trip.start + 'T12:00:00').toLocaleDateString(lang === 'ja' ? 'ja-JP' : 'en-US', opts);
  if (trip.start === trip.end) return a;
  const b = new Date(trip.end + 'T12:00:00').toLocaleDateString(lang === 'ja' ? 'ja-JP' : 'en-US', opts);
  return `${a} – ${b}`;
}

async function openTrips() {
  $('trip-panel').style.display = 'flex';
  const box = $('trip-list');
  box.innerHTML = `<div class="trip-note">…</div>`;
  let data;
  try {
    data = await (await fetch('/api/away')).json();
  } catch (e) {
    box.innerHTML = `<div class="trip-note">offline</div>`;
    return;
  }

  if (!data.linked) setTripStatus(T().trip_unlinked, true);
  else if (data.last_error) setTripStatus(T().trip_error(data.last_error), true);
  else if (data.last_sync) setTripStatus(T().trip_synced(new Date(data.last_sync).toLocaleString()), false);
  else setTripStatus(T().trip_never, false);

  box.innerHTML = '';
  if (!data.trips.length) { box.innerHTML = `<div class="trip-note">${T().trip_none}</div>`; return; }

  const mk = trip => {
    const div = document.createElement('div');
    div.className = 'triprow' + (trip.pending ? '' : ' settled');
    div.innerHTML = `<div class="when"></div><div class="what"></div><div class="why"></div>
      <div class="acts"><button class="yes"></button><button class="no"></button></div>`;
    div.querySelector('.when').textContent =
      `${fmtSpan(trip)} · ${T().trip_days(trip.days.length)}`;
    div.querySelector('.what').textContent =
      [trip.summary, trip.location].filter(Boolean).join(' · ') || T().trip_manual;
    div.querySelector('.why').textContent = trip.reason;
    const yes = div.querySelector('.yes'), no = div.querySelector('.no');
    yes.textContent = T().trip_yes; no.textContent = T().trip_no;
    if (!trip.pending) yes.setAttribute('aria-pressed', 'true');
    const rule = async status => {
      yes.disabled = no.disabled = true;
      await setAway(trip.days, status);
      openTrips();  // cycles moved — re-read rather than guess at the new state
    };
    yes.onclick = () => rule('confirmed');
    no.onclick = () => rule('rejected');
    return div;
  };

  const pending = data.trips.filter(t => t.pending), settled = data.trips.filter(t => !t.pending);
  for (const [rows, label] of [[pending, T().trip_h_pending], [settled, T().trip_h_settled]]) {
    if (!rows.length) continue;
    const h = document.createElement('h3');
    h.textContent = label;
    box.appendChild(h);
    rows.forEach(t => box.appendChild(mk(t)));
  }
}

/* This page's version, beside the one the server is serving. They differ only
 * when the phone is holding an older shell — the failure that made "I shipped
 * it" and "I can see it" disagree for weeks, with nothing on screen to say so.
 * Now it says so, and says what to do about it. */
async function showBuild() {
  const el = $('buildline');
  if (!el) return;
  el.textContent = T().build_page(BUILD);
  try {
    const res = await fetch('/health', { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    if (d.build && d.build !== BUILD) {
      el.textContent = T().build_stale(BUILD, d.build);
      el.classList.add('stale');
    }
  } catch (e) { /* offline: the page's own stamp is still worth showing */ }
}

/* The button that makes a stale phone current, without Android's settings.
 *
 * Until now the only advice this page could give was "pull down / reopen", and
 * neither does anything: a Capacitor WebView has no pull-to-refresh, and a
 * reopen re-navigates to a URL the HTTP cache is still free to answer from its
 * own store. A phone could therefore see the warning, do exactly as told, and
 * stay stale — which is how a fix shipped on 2026-09-07 sat unseen on the
 * handset it was written for.
 *
 * Two things stand between this page and the current one. The HTTP cache entry,
 * bypassed by fetching with cache:'reload', which also rewrites it so the
 * navigation a moment later is answered by the copy just fetched. And the
 * service worker: one from before the no-cache fix answers /sw.js requests for
 * its own replacement out of the very cache that is stale, so left alone it
 * cannot update itself out of the deadlock.
 *
 * NOTHING IS DELETED HERE, and that is the second half of the safety property.
 * An earlier draft cleared Cache Storage and unregistered the workers before
 * reloading. It fetched the page first, so it could not strand a phone whose
 * tailnet was already down — but connectivity dropping in the window between
 * that fetch and the reload would have left no offline shell AND no worker to
 * serve one, on a page whose no-cache headers make the reload ask the network
 * again. Rare, and the app is used in shops on a phone radio, which is where
 * rare happens.
 *
 * registration.update() gets the same result with no such window: it refetches
 * sw.js past the cache, and the new worker POPULATES its cache in install and
 * evicts the old ones in activate — so eviction is atomic with having something
 * to evict to, and never runs at all if the install could not complete. If the
 * update fails we stay on the old worker, which is an old app rather than no
 * app. Strictly better than doing it from out here. */
async function reloadApp() {
  const btn = $('reload-btn'), err = $('reload-err');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = T().reload_working;
  err.classList.remove('on');

  try {
    // cache:'reload' skips the freshness check and refreshes the stored entry,
    // so the navigation below finds a current copy rather than repeating this.
    const res = await fetch('/', { cache: 'reload' });
    if (!res.ok) throw new Error('http ' + res.status);
    await res.text();   // drain it, so the entry is fully written before we go
  } catch (e) {
    btn.disabled = false;
    btn.textContent = T().reload_btn;
    err.textContent = T().reload_fail;
    err.classList.add('on');
    return;
  }

  // Only now, with a good copy in hand: hand the worker its own replacement.
  try {
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.update()));
    }
  } catch (e) { /* not fatal — the old worker still serves a working app */ }

  window.hardReload();
}

/* The reload goes through a named seam for the same reason the APK launcher's
 * navigation does: jsdom locks location.reload, so without one the branch that
 * decides WHETHER to reload cannot be tested — and that branch is the whole
 * safety property here. */
function hardReload() { location.reload(); }
window.hardReload = hardReload;
window.reloadApp = reloadApp;
$('reload-btn').onclick = reloadApp;

/* Its own panel behind ⚙️, rather than the foot of the Stores list where it
 * first landed. That position was reachable only by scrolling past the store
 * rows and the search results, and the owner — who had asked for this button —
 * could not find it. A control for "the app is showing me the wrong thing" has
 * to be somewhere you would look while thinking exactly that.
 *
 * showBuild() re-runs on open so the comparison is made when it is read, not
 * whenever the language was last applied. */
$('set-btn').onclick = () => { $('set-panel').style.display = 'flex'; showBuild(); };
$('set-close').onclick = () => $('set-panel').style.display = 'none';

/* ============ stores panel: where-to-buy plan + store management ============ */
$('stores-btn').onclick = () => { $('stores-panel').style.display = 'flex'; renderStores(); };
$('stores-close').onclick = () => $('stores-panel').style.display = 'none';

/* A price link is a network round trip to the chain, and the panel can be
 * rebuilt under it at any moment — by the other phone, or by any op of our own.
 * So both the in-flight state and the reason a link failed live OUT here, keyed
 * by store id, and renderStores() draws them: a rebuild redraws the same thing
 * instead of silently discarding it.
 *
 * Before this, the handler wrote its result into the `lk` element it had
 * captured in a closure. If the row had been rebuilt in the meantime that node
 * was detached, so a failure reason was written somewhere nobody could see it,
 * and the fresh button came back enabled — the same lookup could be fired
 * twice. The panel's own guard used to hide this by suppressing the rebuild
 * while the button held focus, but the handler's first act is to disable the
 * button, and a disabled element is not focusable, so the protection was
 * already gone before the request was even sent. State that must survive a
 * repaint does not belong in the DOM being repainted. */
const linking = new Set();      // store ids with a lookup in flight
const linkFail = new Map();     // store id -> why the last attempt found nothing
/* store id -> the branch number a lookup just returned, held until the server
 * confirms it. enqueue() is optimistic: it returns the moment the op is on the
 * queue, and base.stores still shows no link until the upsert round-trips. Drop
 * the pending flag on that alone and the Link button comes straight back,
 * enabled, offering to run the same lookup again — and offline, where the op may
 * sit queued for hours, it would offer that every time the panel is drawn. */
const linkOpt = new Map();

/* The ONE way to redraw an already-open Stores panel. Everything routes through
 * here so the typing guard cannot be sidestepped.
 *
 * It protects a half-typed note, the new-store name and the store search from
 * being rebuilt under the user's fingers. It deliberately does NOT protect a
 * focused button: tapping one focuses it on Android, and treating that as
 * "someone is typing here" suppressed every redraw from the tap onward — which
 * is why a deleted store stayed on screen and delete looked broken.
 *
 * A redraw skipped here is not a redraw lost. Everything the panel shows lives
 * outside it — base, linking, linkFail, linkOpt — so the next render paints the
 * same truth. That is the point of keeping it out of the DOM. */
function refreshStores() {
  const focused = document.activeElement;
  const typing = focused && $('stores-panel').contains(focused)
    && (focused.tagName === 'TEXTAREA' || focused.tagName === 'INPUT');
  if ($('stores-panel').style.display === 'flex' && !typing) renderStores();
}

function renderStores() {
  // "I'm at…" selector
  const at = $('at-chips'); at.innerHTML = '';
  const cur = currentStore();
  const mkAt = (label, val) => {
    const c = document.createElement('span');
    c.className = 'chip' + ((cur || '') === val ? ' sel' : '');
    c.textContent = label;
    c.onclick = () => {
      setCurrentStore(val);
      // A different shop is a different shelf layout; nothing learned about the
      // last one carries over.
      aisleMap = null; aisleFor = null; aisleMsg = '';
      renderStores();
      if (viewMode() === 'aisle') loadAisles(); else render();
    };
    at.appendChild(c);
  };
  mkAt(T().at_none, '');
  (base.stores || []).forEach(s => mkAt('🏬 ' + s.name, s.name));

  // the plan: current list grouped by recommended store — computed client-side
  // over view() so it works offline and reflects pending ops (review delta 6)
  const items = view();
  const groups = new Map();
  for (const it of items) {
    const k = it.store || '';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  const pg = $('plan-groups'); pg.innerHTML = '';
  if (!items.length) pg.innerHTML = `<div class="stores-note">${T().empty}</div>`;
  const keys = [...groups.keys()].sort((a, b) =>
    (a === '') - (b === '') || a.localeCompare(b));   // unassigned bucket last
  for (const k of keys) {
    const gi = groups.get(k);
    let sum = 0, unk = 0;
    gi.forEach(i => { if (i.budget != null) sum += i.budget; else unk++; });
    const div = document.createElement('div');
    div.className = 'plangroup';
    div.innerHTML = `<div class="ghead"><b></b><span class="gsum"></span></div>`;
    div.querySelector('b').textContent = k ? '🏬 ' + k : T().unassigned;
    div.querySelector('.gsum').textContent = [
      sum ? T().est(Math.round(sum).toLocaleString()) : '',
      unk ? T().plus_unk(unk) : '',
    ].filter(Boolean).join(' ');
    for (const i of gi) {
      const p = document.createElement('div');
      p.className = 'pitem';
      p.innerHTML = '<span class="pnm"></span><span class="pmeta"></span>';
      const ico = i.emoji || (i.category ? catEmoji(i.category) : '');
      p.querySelector('.pnm').textContent =
        (ico ? ico + ' ' : '') + disp(i) + (i.note ? ' · ' + i.note : '');
      p.querySelector('.pmeta').textContent = [
        i.qty_note, i.budget != null ? fmtYen(i.budget) : '',
        i.store_source === 'history' ? T().src_hist : '',
      ].filter(Boolean).join(' ');
      div.appendChild(p);
    }
    pg.appendChild(div);
  }

  // store management: notes (shared household knowledge) + delete
  const sr = $('store-rows'); sr.innerHTML = '';
  for (const s of (base.stores || [])) {
    const div = document.createElement('div');
    div.className = 'storerow';
    div.innerHTML = `<div class="srhead"><b></b><button class="del"></button></div>
      <textarea maxlength="300"></textarea><button class="savenotes"></button>`;
    div.querySelector('b').textContent = '🏬 ' + s.name;
    const meta = [];
    if (s.address) {
      const a = document.createElement('div');
      a.className = 'addr'; a.textContent = '📍 ' + s.address;
      meta.push(a);
    }
    // Linking a store to the chain's own branch number is what makes prices and
    // aisles askable. Most stores can never be linked, and say so plainly when
    // asked rather than offering the button and failing silently.
    const lk = document.createElement('div');
    lk.className = 'addr';
    const linked = s.chain_store_id || linkOpt.get(s.id);
    if (linked) {
      lk.textContent = T().link_linked(linked);
      if (s.chain_store_id) linkOpt.delete(s.id);   // the server has it; ours is spent
    } else if (linking.has(s.id)) {
      // No button at all while the lookup is out, so a rebuild cannot hand back
      // a fresh enabled one and let the same request go twice.
      lk.textContent = T().link_trying;
    } else {
      const b = document.createElement('button');
      b.className = 'linkbtn'; b.textContent = T().link_prices;
      b.onclick = async () => {
        linking.add(s.id); linkFail.delete(s.id);
        refreshStores();
        try {
          const res = await fetch('/api/stores/link?store_id=' + encodeURIComponent(s.id));
          let d = res.ok ? await res.json() : {};
          // A store added by name — OpenStreetMap had never heard of it — was
          // never pointed at, and a town can hold more than one branch. The
          // chain found one; the person says whether it is theirs before it
          // is pinned. Declining is not a failure, it is an answer.
          if (d.chain_store_id && d.confirm && !confirm(T().link_confirm(d.confirm))) {
            d = { chain: '', chain_store_id: '', reason: T().link_declined };
          }
          if (d.chain_store_id) {
            // Before enqueue(), which renders — the row should draw as linked
            // on that pass rather than flickering back to an offer to link.
            linkOpt.set(s.id, d.chain_store_id);
            // A store added by name because OpenStreetMap had never heard of
            // it comes back with the chain's own address and coordinates;
            // writing them onto the row is what pins it.
            const pin = (d.address && !s.address) ? { store_address: d.address } : {};
            if (pin.store_address && d.lat != null && d.lon != null) { pin.store_lat = d.lat; pin.store_lon = d.lon; }
            enqueue({ type:'store_upsert', store_name: s.name,
                      store_chain: d.chain, store_chain_id: d.chain_store_id, ...pin });
          } else {
            linkFail.set(s.id, d.reason || T().osm_fail);
          }
        } catch (e) { linkFail.set(s.id, T().osm_fail); }
        linking.delete(s.id);
        refreshStores();
      };
      lk.appendChild(b);
      // The reason sits BESIDE the button rather than replacing it: most of
      // these are "this branch isn't in their index", which is worth saying and
      // worth being able to try again after, without reopening the panel.
      const why = linkFail.get(s.id);
      if (why) {
        const sp = document.createElement('span');
        sp.textContent = ' — ' + why;
        lk.appendChild(sp);
      }
    }
    meta.push(lk);
    let anchor = div.querySelector('.srhead');
    for (const el of meta) { anchor.insertAdjacentElement('afterend', el); anchor = el; }
    const ta = div.querySelector('textarea');
    ta.value = s.notes || ''; ta.placeholder = T().store_notes_ph;
    const sv = div.querySelector('.savenotes'); sv.textContent = T().save_notes;
    ta.oninput = () => sv.style.display = 'inline-block';
    sv.onclick = () => {
      enqueue({ type:'store_upsert', store_name: s.name, store_notes: ta.value.trim() });
      sv.style.display = 'none';
    };
    const del = div.querySelector('.del'); del.textContent = T().store_del;
    del.onclick = () => {
      if (!confirm(T().del_confirm(s.name))) return;
      if (currentStore() === s.name) setCurrentStore('');
      enqueue({ type:'store_delete', store_id: s.id });
    };
    sr.appendChild(div);
  }
  $('newstore-add').onclick = () => {
    const v = $('newstore-name').value.trim();
    if (!v) return;
    enqueue({ type:'store_upsert', store_name: v });
    $('newstore-name').value = '';
    $('storesearch-results').innerHTML = '';
  };
  $('storesearch-go').onclick = searchStores;
  $('storesearch-area').onkeydown = e => { if (e.key === 'Enter') searchStores(); };
}

/* 🔍 — pin a store to the real shop it is, via OpenStreetMap.
 *
 * The ＋ button is deliberately left alone: a shop OSM has never heard of must
 * still be addable by name, and it then behaves exactly as stores did before
 * Phase 6. This is an extra way in, never a gate.
 *
 * Nothing here invents anything. No results means "no results" — the one thing
 * it must never do is offer a plausible address it did not receive. */
function osmNote(msg) {
  const box = $('storesearch-results');
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'osmnote'; d.textContent = msg;
  box.appendChild(d);
}

async function searchStores() {
  const name = $('newstore-name').value.trim();
  if (!name) { osmNote(T().osm_need); return; }
  const area = $('storesearch-area').value.trim();
  osmNote(T().osm_searching);
  let data;
  try {
    const res = await fetch('/api/stores/search?q=' + encodeURIComponent(name)
      + '&area=' + encodeURIComponent(area));
    if (res.status === 503) { osmNote(await why503(res, T().osm_off, T().osm_fail)); return; }
    if (!res.ok) { osmNote(T().osm_fail); return; }
    data = await res.json();
  } catch (e) { osmNote(T().osm_fail); return; }

  const hits = (data && data.results) || [];
  if (!hits.length) { osmNote(T().osm_none); return; }

  const box = $('storesearch-results');
  box.innerHTML = '';
  for (const h of hits) {
    const d = document.createElement('div');
    d.className = 'osmhit';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = '🏬 ' + h.name;
    d.querySelector('span').textContent = h.address || '';
    d.onclick = () => {
      // Two branches of one chain share a name, and stores are keyed by their
      // canonical name — so adding "Wegmans" twice would collapse them into one
      // row, overwriting the first branch's address and its price link. That
      // matters most for exactly the case this feature exists for: comparing
      // the same product at two branches. Disambiguate with the town, and only
      // when a DIFFERENT real place is already using that name.
      // canon() is the twin of the server's db.canonical(), which is what
      // stores are actually keyed by — a free-text "wegmans" and an OSM
      // "Wegmans" are one row there, and a strict === here would miss it.
      const clash = (base.stores || []).some(s =>
        canon(s.name) === canon(h.name) && s.osm_id && s.osm_id !== h.osm_id);
      // A clash MUST produce a different name, so fall through to whatever is
      // available: the town reads best, the street still reads like an address,
      // and the osm_id is ugly but always there. Leaving the name unchanged
      // would let the server's canonical-name upsert overwrite the other branch
      // — which is the whole bug this exists to prevent.
      const tag = h.town
        || (h.address || '').split(',')[0].trim()
        || h.osm_id;
      const name = clash ? `${h.name} (${tag})` : h.name;
      enqueue({
        type:'store_upsert', store_name: name,
        store_osm_id: h.osm_id, store_address: h.address || '',
        store_lat: h.lat, store_lon: h.lon, store_brand: h.brand || '',
      });
      $('newstore-name').value = '';
      $('storesearch-area').value = '';
      box.innerHTML = '';
    };
    box.appendChild(d);
  }
}

window.openSheet = it => openSheet(it);

function render() {
  renderTray();
  refreshStores();
  if (base.plants)
    $('plants').textContent = `🌱 ${base.plants.count}/${base.plants.target}`;
  // detected days nobody has ruled on yet — they are already bending the
  // cycles, so the button says how many rather than waiting to be found
  const pend = base.away_pending || 0;
  $('trips').textContent = pend ? `✈️ ${pend}` : '✈️';
  $('trips').classList.toggle('pending', pend > 0);
  const byAisle = viewMode() === 'aisle' && storeCanAisle() && !!aisleMap;
  let items = view();
  const list = $('list');
  if (byAisle) {
    // Walking order, with everything unknown deliberately last rather than
    // scattered through the aisles it is not in.
    items = items.slice().sort((a, b) => {
      const ga = groupOf(a), gb = groupOf(b);
      return rankCmp(ga.rank, gb.rank) || ga.key.localeCompare(gb.key);
    });
  }
  list.innerHTML = '';
  $('empty').hidden = items.length > 0;
  renderViewToggle();
  if (byAisle && items.some(i => (groupOf(i) || {}).approx)) {
    // Said once, above the list, rather than on every row: the aisle is
    // probably right, the certainty about WHICH product is not.
    const n = $('aislenote');
    n.textContent = (aisleMsg ? aisleMsg + ' · ' : '') + '≈ ' + T().aisle_approx;
    n.classList.add('on');
  }
  let lastKey = undefined;
  for (const it of items) {
    const g = groupOf(it);
    const heads = byAisle || items.some(i => i.category);
    if (g.key !== lastKey && heads) {
      const h = document.createElement('div');
      h.className = 'cat'; h.textContent = g.label;
      list.appendChild(h); lastKey = g.key;
    }
    const li = document.createElement('li');
    li.className = 'item' + (it.pending ? ' pending' : '');
    li.dataset.id = it.id;
    li.innerHTML = `<div class="under"></div>
                    <div class="row"><span class="box"></span>
                    <span class="nm"><span class="nm1"></span></span>
                    <span class="qty"></span><span class="who"></span></div>`;
    const ico = it.emoji || (it.category ? catEmoji(it.category) : '');
    li.querySelector('.nm1').textContent = (ico ? ico + ' ' : '') + disp(it);
    if (it.store || it.note) {   // criteria sub-line: store chip + note
      const sub = document.createElement('span');
      sub.className = 'sub'; sub.style.display = 'block';
      if (it.store) {
        const sc = document.createElement('span');
        sc.className = 'stchip' + (it.store_source === 'history' ? ' hist' : '');
        sc.textContent = '🏬 ' + it.store;
        sub.appendChild(sc);
      }
      if (it.note) sub.appendChild(document.createTextNode(
        (it.store ? ' ' : '') + it.note));
      li.querySelector('.nm').appendChild(sub);
    }
    li.querySelector('.qty').textContent = it.qty_note || '';
    li.querySelector('.who').textContent = it.added_by || '';
    attachGestures(li, it);
    list.appendChild(li);
  }
}

/* ============ gestures: tap=checkoff, long-press=edit sheet ============ */
function attachGestures(li, it) {
  /* Tap = click (down AND up on this item — a pointerup alone must never
   * check anything off; the candidates dropdown closing mid-tap used to leak
   * its pointerup onto the item underneath = ghost purchases).
   * Long-press = 600 ms hold with <12 px movement (a firm hold: opens the
   * quantity/category editor + skip/remove; any-jitter cancellation once made
   * long-press unreachable on real phones, so only distance cancels it).
   * Swipe right = ✓ bought (purchase event) · swipe left = 🚫 skip (no event,
   * re-suggested tomorrow) — same server ops as tap / sheet, different gesture. */
  let timer = null, longFired = false, armed = false, sx = 0, sy = 0;
  let swiping = false, dx = 0;
  const row = li.querySelector('.row'), under = li.querySelector('.under');
  const THRESH = () => Math.max(72, li.offsetWidth * 0.28);
  const disarm = () => { clearTimeout(timer); armed = false; };
  const springBack = () => {
    row.style.transition = 'transform .15s';
    row.style.transform = '';
    under.style.opacity = 0;
    setTimeout(() => row.style.transition = '', 160);
  };
  li.addEventListener('pointerdown', e => {
    armed = true; longFired = false; swiping = false; dx = 0;
    sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { longFired = true; openSheet(it); }, 600);
  });
  li.addEventListener('pointermove', e => {
    dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if (!swiping) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) && !longFired) {
        swiping = true; disarm();
        try { li.setPointerCapture(e.pointerId); } catch (_) {}
      } else if (Math.hypot(dx, dy) > 12) {
        disarm();  // vertical movement: scrolling, not a tap
      }
    }
    if (swiping) {
      row.style.transform = `translateX(${dx}px)`;
      under.className = 'under ' + (dx > 0 ? 'right' : 'left');
      under.textContent = dx > 0 ? '✓ ' + T().swipe_bought : T().swipe_skip + ' 🚫';
      under.style.opacity = Math.min(Math.abs(dx) / THRESH(), 1);
    }
  });
  li.addEventListener('pointercancel', () => { disarm(); if (swiping) springBack(); swiping = false; });
  li.addEventListener('pointerup', () => {
    clearTimeout(timer);
    if (!swiping) return;
    if (dx > THRESH())       { if (Date.now() >= lockUntil) checkoff(it); else springBack(); }
    else if (dx < -THRESH()) skipItem(it);
    else                     springBack();
    swiping = false;
  });
  li.addEventListener('click', () => {
    if (armed && !longFired && !swiping && Date.now() >= lockUntil) checkoff(it);
    armed = false;
  });
  li.addEventListener('contextmenu', e => e.preventDefault());
}

function skipItem(it) {
  lockUntil = Date.now() + 350;
  enqueue({ type:'skip', item_id: it.id });
  // undo for a mis-swipe: put it straight back on the list
  showToast(`🚫 ${disp(it)}`, () => enqueue({ type:'add', name:it.name,
    qty_note:it.qty_note || '', item_id: uuid(), cat:it.category }));
}

/* long-press editor: adjust quantity + category, plus the skip / remove actions */
let editState = null;   // { it, category }
function renderCatOpts() {
  const box = $('sheet-cats'); box.innerHTML = '';
  for (const key of Object.keys(CATS)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'catopt' + (key === editState.category ? ' sel' : '');
    b.innerHTML = `<span class="em"></span><span></span>`;
    b.querySelector('.em').textContent = CATS[key][0];
    b.children[1].textContent = CATS[key][lang === 'ja' ? 1 : 2];
    b.onclick = () => { editState.category = key; renderCatOpts(); };
    box.appendChild(b);
  }
}
function renderStoreOpts() {
  const box = $('sheet-stores'); box.innerHTML = '';
  const names = (base.stores || []).map(s => s.name);
  if (editState.store && !names.includes(editState.store)) names.push(editState.store);
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'stopt' + ((editState.store || '') === val ? ' sel' : '');
    b.textContent = label;
    b.onclick = () => { editState.store = val; renderStoreOpts(); };
    box.appendChild(b);
  };
  mk(T().store_none, '');
  names.forEach(n => mk('🏬 ' + n, n));
  const inp = document.createElement('input');
  inp.id = 'sheet-newstore'; inp.placeholder = '＋ ' + T().new_store_inline;
  inp.maxLength = 60; inp.autocomplete = 'off';
  inp.onchange = () => {
    const v = inp.value.trim();
    if (v) { editState.store = v; renderStoreOpts(); }
  };
  box.appendChild(inp);
}
/* set when the sheet was opened from a candidate in the add row: that text is
 * the user's unsaved input and is only discarded once the edit actually saves */
let clearAddRowOnSave = false;
function closeSheet() {
  $('sheet').style.display = 'none'; editState = null; clearAddRowOnSave = false;
}
/* ============ price comparison (Phase 6C) ===================================
 *
 * "Milk" has no price. "Wegmans Organic Creamy Sunflower Butter, 16 ounce" has
 * one, and a different one at each branch — which is why the product question
 * comes first and is remembered, rather than being asked on every trip.
 *
 * Everything here is looked up from the chain's own catalogue and carries the
 * date it was fetched. Two things it must never do: show a number it did not
 * receive, and let an approximate name match pass as the product the household
 * actually buys. The second is marked, not hidden — the aisle from a near match
 * is useful, the price from one is a different product's price.
 */
function pnote(msg) {
  const box = $('sheet-prices');
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'pnote'; d.textContent = msg;
  box.appendChild(d);
}

function pricedStores() {
  return (base.stores || []).filter(s => s.chain_store_id);
}

async function comparePrices(it) {
  const stores = pricedStores();
  if (!stores.length) { pnote(T().cmp_need_store); return; }
  // Ask the store you are standing in, else the first that can answer.
  const cur = currentStoreRow();
  const ask = (cur && cur.chain_store_id) ? cur : stores[0];

  pnote(T().cmp_searching);
  let opts = [];
  try {
    const res = await fetch('/api/products/search?catalog_id=' + encodeURIComponent(it.catalog_id)
      + '&store_id=' + encodeURIComponent(ask.id));
    if (res.status === 503) { pnote(await why503(res, T().cmp_off, T().cmp_fail)); return; }
    if (!res.ok) { pnote(T().cmp_fail); return; }
    const d = await res.json();
    opts = d.options || [];
    if (!opts.length) { pnote(T().cmp_none); return; }
    renderProductChoice(it, opts, d.picked);
  } catch (e) { pnote(T().cmp_fail); }
}

function renderProductChoice(it, opts, picked) {
  const box = $('sheet-prices');
  box.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'pnote'; h.textContent = T().cmp_pick;
  box.appendChild(h);
  for (const o of opts) {
    const row = document.createElement('div');
    row.className = 'prow' + (picked && picked.sku === o.sku ? ' sel' : '');
    row.innerHTML = '<span class="pn"></span><span class="pp"></span><span class="pu"></span>';
    row.querySelector('.pn').textContent =
      [o.brand, o.name].filter(Boolean).join(' · ') + (o.pack_size ? ` (${o.pack_size})` : '');
    row.querySelector('.pp').textContent = o.amount == null ? '—' : fmtYen(o.amount);
    row.querySelector('.pu').textContent = o.unit_price || '';
    row.onclick = () => {
      enqueue({ type:'product_pick', catalog_id: it.catalog_id, pick_chain: o.source,
                pick_sku: o.sku, pick_name: o.name, pick_brand: o.brand, pick_size: o.pack_size });
      // The sku goes with the request rather than being read back from the op:
      // enqueue() is optimistic, so the pick has not necessarily landed yet and
      // the first comparison would otherwise price whatever the generic name
      // happened to match.
      // The aisle view was built from the generic name; this item now means a
      // specific jar, which may sit somewhere else. Update it from the option
      // just chosen rather than re-asking: enqueue() is optimistic, so a fresh
      // /api/aisles would race the uncommitted pick, rebuild from the OLD
      // generic name, and cache that under an unchanged key — pinning the stale
      // aisle in place. The chosen record already knows where it sits.
      if (aisleMap) {
        const k = String(it.catalog_id);
        // We just looked this item up successfully, whatever the answer was —
        // so it is no longer one of the ones nobody got to ask about.
        aisleUnasked.delete(k);
        // No aisle for the chosen jar means we no longer know where this item
        // is — the entry sitting there belongs to the generic match and would
        // now be read as this product's exact location.
        if (o.aisle_label) aisleMap[k] = { label: o.aisle_label, aisle: o.aisle, exact: true };
        else delete aisleMap[k];
      }
      render();
      showPrices(it, o.sku, o.name, o.source);
    };
    box.appendChild(row);
  }
}

/** Which kind of 503: the owner switched it off, or the provider fell over.
 *  One is a setting to change, the other is weather to wait out — telling the
 *  user the wrong one sends them to fix something that is not broken. */
async function why503(res, offMsg, failMsg) {
  try {
    const d = await res.json();
    const code = d && d.detail && d.detail.code;
    return code === 'lookup_disabled' ? offMsg : failMsg;
  } catch (e) { return failMsg; }
}

/** "today" / "3 d ago" — a price with no age is a price presenting itself as
 *  current, which it may well not be. */
function agoLabel(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (!isFinite(d) || d < 0) return '';
  return d === 0 ? T().cmp_today : T().cmp_days(d);
}

/* `chain` says whose sku this is. A Wegmans sku, a Whole Foods ASIN and a
 * ShopRite UPC are three namespaces: sent without its chain, a just-picked
 * ASIN could never match at ShopRite and that store's quote would be filed
 * under "what they have instead" even where a pick already exists there. */
async function showPrices(it, sku, name, chain) {
  pnote(T().cmp_searching);
  let d;
  try {
    const res = await fetch('/api/prices?catalog_id=' + encodeURIComponent(it.catalog_id)
      + (sku ? '&sku=' + encodeURIComponent(sku) : '')
      + (name ? '&name=' + encodeURIComponent(name) : '')
      + (sku && chain ? '&chain=' + encodeURIComponent(chain) : ''));
    if (res.status === 503) { pnote(await why503(res, T().cmp_off, T().cmp_fail)); return; }
    if (!res.ok) { pnote(T().cmp_fail); return; }
    d = await res.json();
  } catch (e) { pnote(T().cmp_fail); return; }

  const quotes = d.quotes || [];
  const alts = d.alternatives || [];
  if (!quotes.length && !alts.length) { pnote(T().cmp_none); return; }
  const box = $('sheet-prices');
  box.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'pnote'; h.textContent = T().cmp_at(quotes.length);
  box.appendChild(h);
  let anyApprox = false;
  // A price you cannot act on is not a cheaper option. Out-of-stock quotes stay
  // visible — "cheap here, but not today" is worth knowing — but they sort
  // below every buyable one and cannot be picked, so the cheapest row on screen
  // is always somewhere you can actually buy the thing.
  const ordered = quotes.slice().sort((a, b) =>
    (a.available === false) - (b.available === false) || a.amount - b.amount);
  for (const q of ordered) {
    if (!q.exact) anyApprox = true;
    const oos = q.available === false;
    const row = document.createElement('div');
    row.className = 'prow' + (oos ? ' oos' : '');
    row.innerHTML = '<span class="pn"></span><span class="pp"></span><span class="pu"></span>';
    row.querySelector('.pn').textContent =
      '🏬 ' + q.store + (q.aisle ? ' · ' + q.aisle : '') + (q.exact ? '' : ' ≈')
      + (oos ? ' · ' + T().cmp_oos : '');
    row.querySelector('.pp').textContent = fmtYen(q.amount);
    row.querySelector('.pu').textContent =
      [q.unit_price || '', agoLabel(q.fetched_at)].filter(Boolean).join(' · ');
    // The number's own source, openable. A price you cannot check is a price you
    // have to take on faith, and these are looked up rather than observed.
    if (q.source_url) {
      const a = document.createElement('a');
      a.className = 'psrc'; a.href = q.source_url; a.target = '_blank';
      a.rel = 'noopener'; a.textContent = '↗';
      a.onclick = e => e.stopPropagation();
      row.appendChild(a);
    }
    // Tapping a store pins it as where this item is bought — the mechanism the
    // where-to-buy plan already runs on. Not offered for a store that has none.
    if (!oos)
      row.onclick = () => enqueue({ type:'edit', catalog_id: it.catalog_id, store: q.store });
    box.appendChild(row);
  }
  // Shown BELOW the comparison and never sorted into it: these are what the
  // shop has instead of the product you buy, not a cheaper version of it.
  if (alts.length) {
    const h2 = document.createElement('div');
    h2.className = 'pnote'; h2.textContent = T().cmp_alt_head;
    box.appendChild(h2);
    for (const q of alts) {
      const row = document.createElement('div');
      row.className = 'prow oos';
      row.innerHTML = '<span class="pn"></span><span class="pp"></span><span class="pu"></span>';
      row.querySelector('.pn').textContent =
        '🏬 ' + q.store + ' · ' + [q.brand, q.product].filter(Boolean).join(' ')
        + (q.pack_size ? ` (${q.pack_size})` : '');
      row.querySelector('.pp').textContent = fmtYen(q.amount);
      row.querySelector('.pu').textContent = q.unit_price || '';
      box.appendChild(row);
    }
  }
  if (anyApprox || d.partial) {
    const f = document.createElement('div');
    f.className = 'pnote';
    f.textContent = [anyApprox ? T().cmp_approx : '', d.partial ? T().cmp_fail : '']
      .filter(Boolean).join(' · ');
    box.appendChild(f);
  }
}

/* Exposed for the tests in app/tests/. The page runs under "use strict", so a
 * declaration stays in its own scope and the item editor is otherwise only
 * reachable through a 0.6 s long-press — simulating that gesture would test
 * jsdom's pointer emulation more than it tests this app. Same seam, and the
 * same reason, as openServer() in the APK launcher. */
function openSheet(it) {
  clearAddRowOnSave = false;
  editState = { it, category: it.category || 'other',
                // only an EXPLICIT preference preselects — a history-derived
                // recommendation must not silently become a pin on Save
                store: it.store_source === 'preferred' ? it.store : '' };
  $('sheet-title').textContent = disp(it);
  $('sheet-name').value = it.name || '';
  $('sheet-qty').value = it.qty_note || '';
  $('sheet-note-input').value = it.note || '';
  $('sheet-budget').value = it.budget == null ? '' : String(it.budget);
  // Prices are looked up on demand, never on open: opening the editor to change
  // a quantity must not fire a network request describing what you are buying.
  $('sheet-prices').innerHTML = '';
  $('sheet-compare').textContent = T().compare;
  $('sheet-compare').onclick = () => comparePrices(it);
  renderStoreOpts();
  renderCatOpts();
  $('sheet').style.display = 'flex';
  // the card is a scroll container and is REUSED across opens — without this it
  // reopens wherever the last edit left it (e.g. down at Remove/Cancel), which
  // puts Name and Quantity back off-screen, the very thing the cap fixed
  $('sheet').querySelector('.card').scrollTop = 0;
  // size the note box to its content (scrollHeight is 0 while hidden — do it
  // after display:flex); grows as the user types, capped at ~5 lines
  const ta = $('sheet-note-input');
  const fit = () => { ta.style.height = ''; ta.style.height = Math.min(ta.scrollHeight + 3, 140) + 'px'; };
  ta.oninput = fit; fit();
  $('sheet-skip').onclick   = () => { closeSheet(); enqueue({ type:'skip',   item_id:it.id }); };
  $('sheet-remove').onclick = () => { closeSheet(); enqueue({ type:'remove', item_id:it.id }); };
}
function saveSheet() {
  if (!editState) return;
  const it = editState.it, qty = $('sheet-qty').value.trim();
  const name = $('sheet-name').value.trim();
  const note = $('sheet-note-input').value.trim();
  const budget = $('sheet-budget').value.trim();
  // catalog_id lets criteria apply server-side even if the item was checked
  // off while the sheet was open (criteria are catalog-level and must survive)
  const fields = { type:'edit', item_id: it.id };
  if (it.catalog_id) fields.catalog_id = it.catalog_id;
  let changed = false;
  if (name && name !== it.name)                    { fields.name = name;                 changed = true; }
  if (qty !== (it.qty_note || ''))                 { fields.qty_note = qty;              changed = true; }
  if (editState.category !== (it.category || 'other')) { fields.category = editState.category; changed = true; }
  if (note !== (it.note || ''))                    { fields.note = note;                 changed = true; }
  if (budget !== (it.budget == null ? '' : String(it.budget))) { fields.budget = budget; changed = true; }
  const origStore = it.store_source === 'preferred' ? it.store : '';
  if ((editState.store || '') !== origStore)       { fields.store = editState.store || ''; changed = true; }
  if (changed) enqueue(fields);
  if (clearAddRowOnSave) { $('name').value = ''; $('qty').value = ''; }
  closeSheet();
}
$('sheet-save').onclick = saveSheet;
$('sheet-cancel').onclick = closeSheet;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };

/* ============ ops ============ */
function enqueue(fields) {
  const op = { op_id: uuid(), actor, ...fields };
  queue.push(op); saveQueue(); render(); flush();
  return op;
}

/* "I'm at: <store>" — while set, check-offs are stamped with the store, which
 * silently builds the where-bought history behind the plan. Expires after 6 h:
 * a stale selection would poison the history (review delta 8). */
const AT_KEY = 'pc_at', AT_TTL = 6 * 3600 * 1000;
/* ============ aisle view (Phase 6B) =========================================
 *
 * While standing in a store that can answer, the list regroups from category
 * order into the order you actually walk it. The aisle labels come from the
 * chain's own shelf data for THAT branch — the same lookup that prices the
 * item — so "Aisle 14B · left · sec 11" is a real instruction.
 *
 * An item whose aisle is unknown goes to a group at the end and says so. It is
 * never placed in a plausible aisle: being told the wrong one costs a lap of
 * the shop, which is worse than being told nothing. An item matched by name
 * rather than by the product you actually buy is marked, because the aisle is
 * probably right and the certainty is not.
 */
const VIEW_KEY = 'pc_view';
let aisleMap = null;      // catalog_id -> {label, aisle, exact}
let aisleMsg = '';        // what to say above the list, if anything
let aisleFor = null;      // which store+list aisleMap belongs to
let aisleUnasked = new Set();  // items the lookup never got to ask about

const viewMode = () => localStorage.getItem(VIEW_KEY) === 'aisle' ? 'aisle' : 'cat';

/** Called after any state that arrived from the server. The aisle map is keyed
 *  on the list, and the list changes under you — the other phone adds milk
 *  while you are walking. Without this, that item sits in "Aisle unknown" for
 *  the rest of the trip. loadAisles() no-ops when the key is unchanged, so this
 *  costs nothing on the many state updates that are not list changes. */
function syncAisles() {
  if (viewMode() === 'aisle' && storeCanAisle()) loadAisles();
}

/** The store row for "I'm at…", or null. */
function currentStoreRow() {
  const name = currentStore();
  if (!name) return null;
  return (base.stores || []).find(s => s.name === name) || null;
}

/** Can this store answer where things are? Most cannot, and that is ordinary. */
function storeCanAisle() {
  const s = currentStoreRow();
  return !!(s && s.chain_store_id);
}

/** Identity of "the aisle question currently on screen": which store, and which
 *  items. Keyed on the LIST as well as the store, because adding something
 *  while walking must fetch its aisle rather than leave it in "unknown". */
function currentAisleKey() {
  const s = currentStoreRow();
  if (!s) return '';
  const ids = view().map(i => i.catalog_id).sort();
  // Picks belong in the key too: the OTHER phone choosing a specific jar moves
  // where this item is, and the local picker's direct patch cannot know about
  // it. Only the picks for items actually on the list matter.
  const picks = ids.map(id => id + ':' + ((base.picks || {})[String(id)] || '')).join(',');
  return s.id + '|' + picks;
}

async function loadAisles() {
  const s = currentStoreRow();
  if (!s || !s.chain_store_id) { aisleMap = null; return; }
  const listKey = currentAisleKey();
  if (aisleFor === listKey && aisleMap) return;
  aisleMsg = T().aisle_loading(s.name); render();
  // Two loads can overlap — change shops, or the other phone edits the list
  // mid-request — and the older reply may land last. EVERY path out of here
  // mutates shared state, failures included: an older 503 arriving after a
  // newer success would wipe the current store's aisles and blame the wrong
  // thing. So the guard belongs on all of them, not just on success.
  const mine = () => listKey === currentAisleKey();
  try {
    const res = await fetch('/api/aisles?store_id=' + encodeURIComponent(s.id));
    if (res.status === 503) {
      const msg = await why503(res, T().aisle_off, T().aisle_fail);
      if (!mine()) return;
      aisleMap = null; aisleMsg = msg; render(); return;
    }
    if (!res.ok) {
      if (!mine()) return;
      aisleMap = null; aisleMsg = T().aisle_fail; render(); return;
    }
    const d = await res.json();
    if (!mine()) return;
    aisleMap = d.aisles || {};
    aisleUnasked = new Set(d.unasked || []);
    aisleFor = listKey;
    // "no aisle for this" and "nobody could ask about this" look identical in
    // the map. Only the second is a failure, and only it gets said out loud.
    aisleMsg = d.partial ? T().aisle_partial
             : (Object.keys(aisleMap).length ? '' : T().aisle_none);
  } catch (e) {
    if (!mine()) return;
    aisleMap = null; aisleMsg = T().aisle_fail;
  }
  render();
}

/* Walking order, not alphabetical order. Aisles are strings like "2", "09B",
 * "14B" — sorted as text, aisle 10 lands before aisle 2 and the one thing this
 * view promises is wrong. Numbered aisles come first in numeric order (letter
 * suffix breaking ties), then departments like Dairy, then unknown. */
function aisleRank(raw) {
  const m = /^(\d+)([A-Za-z]*)$/.exec((raw || '').trim());
  if (m) return [0, parseInt(m[1], 10), m[2].toUpperCase()];
  return [1, 0, (raw || '').toUpperCase()];
}
const rankCmp = (a, b) => {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i], y = b[i];
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    if (x < y) return -1;
    if (x > y) return 1;
  }
  return 0;
};

/** Group key, heading and sort rank for one item, under the active view. */
function groupOf(it) {
  if (viewMode() === 'aisle' && aisleMap) {
    const a = aisleMap[String(it.catalog_id)];
    if (a) return { key: 'a:' + a.label, label: a.label, approx: !a.exact,
                    rank: [0, ...aisleRank(a.aisle)] };
    // Never asked is not the same as has no aisle, and gets its own group so it
    // cannot be read as one.
    if (aisleUnasked.has(String(it.catalog_id)))
      return { key: 'zzy-unasked', label: T().aisle_unasked, approx: false, rank: [8] };
    return { key: 'zzz-unknown', label: T().aisle_unknown, approx: false, rank: [9] };
  }
  return { key: 'c:' + (it.category || 'other'), label: catLabel(it.category),
           approx: false, rank: [0] };
}

function renderViewToggle() {
  const on = storeCanAisle();
  $('viewtoggle').classList.toggle('on', on);
  $('view-cat').textContent = T().view_cat;
  $('view-aisle').textContent = T().view_aisle;
  const m = viewMode();
  $('view-cat').classList.toggle('sel', m === 'cat');
  $('view-aisle').classList.toggle('sel', m === 'aisle');
  const note = on && m === 'aisle' ? aisleMsg : '';
  $('aislenote').textContent = note;
  $('aislenote').classList.toggle('on', !!note);
}

$('view-cat').onclick = () => { localStorage.setItem(VIEW_KEY, 'cat'); render(); };
$('view-aisle').onclick = () => {
  localStorage.setItem(VIEW_KEY, 'aisle');
  render();
  loadAisles();
};

function currentStore() {
  try {
    const v = JSON.parse(localStorage.getItem(AT_KEY) || 'null');
    if (v && v.name && Date.now() - v.at < AT_TTL) return v.name;
  } catch (e) {}
  return null;
}
const setCurrentStore = name => name
  ? localStorage.setItem(AT_KEY, JSON.stringify({ name, at: Date.now() }))
  : localStorage.removeItem(AT_KEY);

function checkoff(it) {
  lockUntil = Date.now() + 350;
  const at = currentStore();
  const op = enqueue({ type:'checkoff', item_id: it.id, ...(at ? { store: at } : {}) });
  showToast(`✓ ${disp(it)}`, () => {
    // undo: if the checkoff is still queued locally, just retract it;
    // otherwise ask the server to delete the purchase_event + restore.
    const qi = queue.findIndex(o => o.op_id === op.op_id);
    if (qi >= 0 && !op.sent) { queue.splice(qi,1); saveQueue(); render(); }
    else enqueue({ type:'undo_checkoff', target_op_id: op.op_id });
  });
}

$('add').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) return;
  enqueue({ type:'add', name, qty_note:$('qty').value.trim(), item_id: uuid() });
  $('name').value = ''; $('qty').value = '';
  hideCands();
  $('name').focus();
});

/* ============ typing candidates (seeded catalog + own history) ============ */
const hideCands = () => $('cands').style.display = 'none';
$('name').addEventListener('input', renderCands);
$('name').addEventListener('focus', renderCands);
document.addEventListener('pointerdown', e => {
  if (!$('add').contains(e.target)) hideCands();
});

/* rank a name set against the query: 0 = prefix hit, 1 = substring, null = miss */
function candRank(keys, q) {
  let rank = null;
  for (const k of keys.filter(Boolean).map(fold)) {
    if (k.startsWith(q)) return 0;
    if (k.includes(q)) rank = 1;
  }
  return rank;
}

function renderCands() {
  const q = fold($('name').value);
  const box = $('cands');
  if (!q) { hideCands(); return; }
  const items = view();
  const listed = new Map(items.map(i => [canon(i.name), i]));
  /* Which listed item does this catalog row mean? Identity is by ALIAS on the
   * server (get_or_create_catalog resolves "milk" onto the 牛乳 row), so the
   * display name alone is not enough: an offline-added "milk" would otherwise
   * not match the 牛乳 row, the row would render as a fresh add, and the add
   * would dedupe server-side — throwing away the qty the user just typed. */
  const listedFor = c => {
    for (const k of [c.name, c.name_en, ...(c.aliases || [])]) {
      const m = k && listed.get(canon(k));
      if (m) return m;
    }
    return null;
  };
  const hits = [], seen = new Set(), shown = new Set();
  /* Items ALREADY on the list are shown, not skipped. Retyping an item is how
   * you find it again to change its quantity — hiding it made the dropdown come
   * up empty with no way in. Matched off the LIST first (not just the catalog),
   * so a just-added item with no catalog row yet still surfaces. Sort key is
   * rank*2 (+1 when already listed) → within a rank, things you can still add
   * come before things you already have. */
  for (const it of items) {
    const rank = candRank([it.name, it.name_en], q);
    if (rank === null) continue;
    seen.add(canon(it.name));
    shown.add(it.id);
    hits.push([rank * 2 + 1, it, it]);
  }
  for (const c of catalog) {                    // catalog arrives most-bought-first
    if (seen.has(canon(c.name))) continue;
    const rank = candRank([c.name, ...(c.aliases || [])], q);
    if (rank === null) continue;
    const on = listedFor(c);
    if (on && shown.has(on.id)) continue;       // same item, already offered above
    if (on) shown.add(on.id);
    hits.push([rank * 2 + (on ? 1 : 0), c, on]);
  }
  hits.sort((a, b) => a[0] - b[0]);             // stable → buys order kept within rank
  box.innerHTML = '';
  for (const [, c, on] of hits.slice(0, 8)) {
    const div = document.createElement('div');
    div.className = 'cand' + (on ? ' on' : '');
    div.innerHTML = '<span></span><span></span><span class="alt"></span><span class="cat-tag"></span>';
    div.children[0].textContent = (on && on.emoji) || catEmoji(c.category);
    div.children[1].textContent = disp(c);
    div.children[2].textContent = on
      ? T().cand_on + (on.qty_note ? ' · ' + on.qty_note : '')
      : dispAlt(c);
    div.children[3].textContent = on ? T().cand_edit
      : (c.category ? (CATS[c.category] || CATS.other)[lang==='ja'?1:2] : '');
    div.addEventListener('pointerdown', e => {
      e.preventDefault();                        // fires before blur → keyboard stays
      const qty = $('qty').value.trim();
      hideCands();
      if (on) {          // already on the list → open the editor instead of re-adding
        $('name').blur();                        // keyboard would cover the sheet
        openSheet(on);
        if (qty) $('sheet-qty').value = qty;     // a qty typed in the add row carries in
        // the add row is NOT cleared here: cancelling the sheet must give the
        // user their typed text back, so it is cleared only once a save lands
        clearAddRowOnSave = true;
        return;
      }
      $('name').value = ''; $('qty').value = '';
      enqueue({ type:'add', name:c.name, qty_note:qty, item_id:uuid(), cat:c.category });
      $('name').focus();
    });
    box.appendChild(div);
  }
  box.style.display = box.children.length ? 'block' : 'none';
}

/* ============ toast ============ */
let toastTimer = null;
function showToast(msg, onUndo) {
  $('toastmsg').textContent = msg;
  $('toast').style.display = 'flex';
  $('undo').onclick = () => { hideToast(); onUndo(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 8000);
}
const hideToast = () => $('toast').style.display = 'none';

/* ============ queue flush (sequential, idempotent server-side) ============ */
async function flush() {
  if (flushing) return;
  flushing = true;
  setPill();
  try {
    while (queue.length) {
      const op = queue[0];
      op.sent = true;
      const res = await fetch('/api/op', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(op),
      });
      if (!res.ok && res.status < 500) { // rejected (422 etc.) — drop, don't wedge queue
        console.error('op rejected', op, await res.text());
        queue.shift(); saveQueue(); continue;
      }
      if (!res.ok) throw new Error('server ' + res.status);
      const body = await res.json();
      // dedupe remap: our optimistic uuid → the existing row's id
      if (op.type === 'add' && body.result?.deduped && body.result.item_id !== op.item_id)
        for (const q of queue) if (q.item_id === op.item_id) q.item_id = body.result.item_id;
      queue.shift(); saveQueue();
    }
    await resync();
  } catch (e) { /* offline — queue persists, retry on next trigger */ }
  flushing = false;
  setPill();
}

async function resync() {
  const res = await fetch('/api/state');
  if (res.ok) { base = await res.json(); saveBase(); render(); syncAisles(); }
  loadCatalog();  // picks up new items + enrichment updates for candidates
}

/* ============ websocket (downstream-only) + reconnect ============ */
function connectWS() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { wsDelay = 1000; setPill(); flush(); };
  ws.onmessage = ev => {
    base = JSON.parse(ev.data); saveBase(); render(); setPill(); syncAisles();
  };
  ws.onclose = () => {
    setPill();
    setTimeout(connectWS, wsDelay);
    wsDelay = Math.min(wsDelay * 2, 15000);
  };
  ws.onerror = () => ws.close();
}

/* phone unlock / tab foreground / network back — the NORMAL in-store path */
const wake = () => { connectWS(); flush(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
window.addEventListener('online', wake);
window.addEventListener('pageshow', wake);

function setPill() {
  const pill = $('pill');
  const live = ws && ws.readyState === 1;
  if (live && !queue.length)      { pill.className='synced';  pill.textContent=T().synced; }
  else if (queue.length && !live) { pill.className='offline'; pill.textContent=T().offline(queue.length); }
  else if (queue.length)          { pill.className='syncing'; pill.textContent=T().syncing; }
  else                            { pill.className='offline'; pill.textContent=T().reconnect; }
}

/* ============ plants & ideas panel (LLM — never blocks the list) ============ */
$('plants').onclick = () => { $('ideas').style.display = 'flex'; loadIdeas(false); };
$('ideas-close').onclick = () => $('ideas').style.display = 'none';
$('ideas-refresh').onclick = () => loadIdeas(true);

function addFromIdeas(name) {
  enqueue({ type:'add', name, qty_note:'', item_id: uuid() });
  showToast(T().added(name), () => {});
}
$('lang').onclick = () => {
  lang = lang === 'en' ? 'ja' : 'en';
  localStorage.setItem('pc_lang', lang);
  applyLang(); render();
};

async function loadIdeas(refresh) {
  const wp = $('week-plants');
  wp.innerHTML = (base.plants?.week || [])
    .map(() => '<span class="pchip"></span>').join('') || '<span class="pchip"></span>';
  [...wp.children].forEach((el, i) => {
    const tok = base.plants?.week?.[i];
    // herbs/spices/garlic/oil/tea/coffee score a fraction of a plant point —
    // show it, or the chip count won't add up to the header number
    const w = tok && base.plants?.weights?.[tok];
    el.textContent = tok ? (w ? `${tok} ·${w === 0.25 ? '¼' : w === 0.5 ? '½' : w}` : tok)
                         : T().none_yet;
  });
  $('week-title').textContent =
    T().week(base.plants?.count ?? 0, base.plants?.target ?? 30);

  $('recipes').innerHTML = `<div class="status">${T().asking}</div>`;
  $('diversity').innerHTML = '';
  try {
    const res = await fetch('/api/ideas' + (refresh ? '?refresh=1' : ''));
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();

    $('recipes').innerHTML = '';
    for (const r of data.recipes) {
      const div = document.createElement('div');
      div.className = 'recipe';
      div.innerHTML = `<b></b><div class="row uses"></div><div class="row miss"></div>
                       <div class="row np"></div><button>＋ Add missing to list</button>`;
      div.querySelector('b').textContent = r.title;
      div.querySelector('.uses').textContent = T().uses + (r.uses || []).join(', ');
      div.querySelector('.miss').textContent = T().missing + (r.missing || []).join(', ');
      div.querySelector('.np').textContent =
        (r.new_plants || []).length ? T().new_plants(r.new_plants.length, r.new_plants.join(', ')) : '';
      const btn = div.querySelector('button');
      btn.textContent = T().add_missing;
      if ((r.missing || []).length)
        btn.onclick = () => { r.missing.forEach(addFromIdeas); btn.disabled = true; btn.textContent = T().added_btn; };
      else btn.remove();
      $('recipes').appendChild(div);
    }
    if (!data.recipes.length)
      $('recipes').innerHTML = `<div class="status">${T().no_recipes}</div>`;

    for (const s of data.diversity) {
      const chip = document.createElement('span');
      chip.className = 'pchip new';
      chip.textContent = `＋ ${s.buy}（${s.plant}）`;
      chip.onclick = () => { addFromIdeas(s.buy); chip.remove(); };
      $('diversity').appendChild(chip);
    }
  } catch (e) {
    $('recipes').innerHTML = `<div class="status">${T().llm_down}</div>`;
  }
}

/* ============ boot ============ */
function boot() {
  applyLang();
  if (!actor) {
    $('namedlg').style.display = 'flex';
    $('namego').onclick = () => {
      const v = $('myname').value.trim();
      if (!v) return;
      actor = v; localStorage.setItem(LS.name, v);
      $('namedlg').style.display = 'none';
    };
  }
  render();       // instant paint from cached base (offline-first)
  connectWS();
  flush();
  loadCatalog();
  // Resume an aisle walk across an app restart — the phone locks constantly
  // mid-shop, and coming back to the category view every time would make the
  // toggle useless exactly when it matters.
  if (viewMode() === 'aisle') loadAisles();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
}
boot();
</script>
