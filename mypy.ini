# Opting thincart into the prepush gate's BLOCKING mypy step.
#
# The gate runs `mypy --ignore-missing-imports .` for every repo, but only fails
# the push for repos that commit a mypy config — the same ratchet ruff.toml
# already provides here. This repo was already at zero errors on 2026-08-24;
# this file is what keeps it there instead of letting a backlog accumulate as
# unread advisory warnings.
#
# Settings mirror the gate's own invocation so a local `mypy .` reproduces it.
[mypy]
ignore_missing_imports = True
